    alt: Five versions of the ONCES logo, from storefront to sticker
  etiquetas:
  - Pricing
  - Logo
  - Branding
  claves:
  - "When you ask how much a logo costs, you're really asking what you'll get: a single file or a system that works everywhere."
  - 'There are four tiers: doing it yourself in Canva or with AI, a standalone logo from a freelancer, a full visual identity and an agency project with strategy.'
  - Always ask for vector files (AI, SVG or PDF), the logo versions and a written transfer of rights.
  - "What raises the price isn't the drawing: it's the versions, the guidelines, the applications, the revision rounds and the research beforehand."
  - My visual identity service starts at USD 500, including logo, versions, guidelines and applications, with a fixed price agreed before we start.
  seo:
    titulo: 'How much does a logo cost in Colombia? Prices and scope'
    descripcion: "What a logo costs in Colombia depending on what you get: Canva, freelancer, visual identity or agency. What to include and what drives the price."
    palabra_clave: how much does a logo cost
  cuerpo: |-
    **How much does a logo cost in Colombia?** It's one of the questions I get asked most, and the honest answer is that it can range from zero to several million pesos. That doesn't mean designers charge at random. It means the word "logo" is used to sell very different things: from a PNG file made in an afternoon to a brand system with guidelines, versions and applications ready for production.

    In this article I explain the four price tiers you'll come across, what you should receive at each one, what pushes a quote up or down and what I charge. I'm not going to give you made-up market figures, because they vary a lot by city, experience and platform. What I will give you is a set of criteria for comparing quotes without being sold smoke.

    ## First: what you're buying when you buy a logo

    Before comparing prices, compare deliverables. Two quotes with the same name can include completely different things:

    - **A standalone logo**: a single version, usually as a PNG or JPG.
    - **A logo with versions**: horizontal, vertical, symbol only, positive and negative, in vector files.
    - **A visual identity**: the logo and its versions, plus a color palette, typefaces, graphic assets and brand guidelines.
    - **A brand project with strategy**: all of the above plus research, positioning, naming and sometimes brand architecture for several product lines.

    If one quote is much cheaper than another, first check which of these tiers it belongs to. The price difference is almost always explained there.

    ## Tier 1: doing it yourself in Canva or with AI

    **Cost: free, or the price of a subscription.** It's the fastest option and works for validating an idea, opening an Instagram account or showing something at a fair.

    The problem is what you can't see. [Canva's license](https://www.canva.com/licensing-explained/) doesn't allow Free or Pro content from its library to be used in a trademark; the exceptions are fonts, simple shapes and lines. On top of that, its templates aren't exclusive. I cover this in depth in [Canva logo vs. brand system](/en/articulos/logo-de-canva-vs-sistema-de-marca/).

    ## Tier 2: a standalone logo from a freelancer

    **Cost: low, and highly variable.** On freelance platforms and social media you'll find logos for very little money. They can be a good option if the designer is good and you're clear about what you'll receive.

    Before you pay, ask:

    - Will you deliver the vector file (AI, SVG or PDF) or only a PNG?
    - How many versions are included: horizontal, vertical, icon, black and white?
    - How many revision rounds are included?
    - Is the design original or based on a template?
    - Will you transfer the rights to me in writing?

    The cheap logo often turns out expensive later, when the printer asks for "the vector file" and you don't have it. Sometimes what you need isn't even a new logo: on Workana, for example, I've been hired to **vectorize an existing logo** and deliver master files for every use. If your brand already works, that may be the smartest investment.

    ## Tier 3: a full visual identity

    **This is where I work. My visual identity service starts at USD 500.** The exact price depends on the scope, but it's always fixed in writing before we start. It includes:

    | Deliverable | What it is | What it does for you |
    | --- | --- | --- |
    | Logo and versions | Horizontal, vertical, icon, color and monochrome | It works on a storefront and on a sticker |
    | Color palette | Colors with codes for screen and print | Your brand looks the same on social media and on paper |
    | Typefaces | For headlines and body text | Everything you publish shares the same visual voice |
    | Brand guidelines | Usage rules and examples | Any supplier can apply it without distorting it |
    | Applications | Packaging, uniforms, stationery, social media, storefront | You see the brand in context before producing anything |

    One example is [Fueggo](/en/trabajo/fueggo/), a system I designed from start to finish: logo variants by background and size, a palette with a clear hierarchy and applications on the storefront, box, uniform, stationery and stickers, all documented for the printer. If you want to see what guidelines contain, I explain it in [what a brand guidelines manual includes](/en/articulos/que-incluye-un-manual-de-marca/).

    ## Tier 4: an agency with brand strategy

    **Cost: the highest.** An agency usually adds market research, workshops with your team, positioning, naming, brand architecture and a team of several people. It makes sense for medium or large companies, high-investment launches or brands with several product lines. For a business that's just starting out, it's almost always more than it needs.

    ## What pushes the price of a logo up or down

    When you compare quotes, look at these factors:

    - **Number of versions and applications.** A logo isn't the same as a logo plus storefront, packaging and uniforms.
    - **Brand guidelines.** Documenting the rules takes time, but it's what protects your investment.
    - **Naming.** If you don't have a name yet, creating and checking one is a separate job.
    - **Revision rounds.** More included rounds means more hours.
    - **Research.** Looking at competitors and the ideal customer before drawing changes the result.
    - **Urgency.** A very short deadline usually costs more.
    - **Experience and portfolio.** A designer with real cases and measurable results charges differently from someone just starting out.

    ## What the final delivery should include

    Whatever you pay, don't close the project without:

    1. **Vector files** (AI, SVG or PDF) for every version.
    2. **Screen files** as PNGs with transparent backgrounds.
    3. **Color codes** for screen (HEX and RGB) and print (CMYK).
    4. **Typeface names** and where to get them, or their license.
    5. **A written transfer of economic rights**, so the brand is yours and you can register it. For registration, talk to an intellectual property lawyer.

    ## When is it worth paying more for a logo?

    Pay for a full visual identity when you're going to produce something physical (packaging, a storefront, uniforms, labels), when you're going to register the brand, when you work with several suppliers or when you compare yourself with competitors and your brand looks improvised. In those cases, redoing it later costs far more than doing it right from the start.

    If you're only validating an idea, start simple and save the budget for when you know the business works.

    ## What I charge and how I work

    My [visual identity](/en/servicios/identidad-visual/) service starts at USD 500. You tell me about your business, I ask about your customers and competitors, and within 24 hours I send you a proposal with scope, deadline and a fixed price. No charges halfway through. I've designed brands for restaurants, nightclubs, streetwear and the dental industry, and on Workana I have a 5.0 out of 5 across all my ratings.
  preguntas:
  - pregunta: How much does a logo cost in Colombia?
    respuesta: It depends on what you receive. Making it in Canva or with AI can be free, a standalone logo from a freelancer is usually inexpensive, a full visual identity with guidelines and applications costs more, and an agency project with strategy is the most expensive. My visual identity service starts at USD 500.
  - pregunta: Which files should I receive with a logo?
    respuesta: Vector files for every version (AI, SVG or PDF), PNGs with transparent backgrounds, color codes for screen and print, the typeface names and a written transfer of rights.
  - pregunta: Why does one designer charge more than another for a logo?
    respuesta: Because of what's included. Versions, brand guidelines, applications, research, revision rounds and experience change the price much more than the drawing itself.
  - pregunta: Can I trademark a logo made in Canva?
    respuesta: Under Canva's license, you can't use Free or Pro content from its library in a trademark; only fonts, simple shapes and lines are exceptions. Talk to an intellectual property lawyer before registering.
  - pregunta: How long does a visual identity take?
    respuesta: It depends on the scope and the revision rounds. When I send the proposal, the delivery date is set in writing along with the price.
  cta:
    titulo: What would your brand cost?
    texto: Tell me about your business and within 24 hours I'll send you scope, deadline and a fixed price.
