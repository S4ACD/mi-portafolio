es:
  titulo: 'Cuánto cuesta un logo en Colombia: precios, qué incluye y cómo no pagar de más'
  publicado: true
  fecha: '2026-10-19'
  resumen: 'El precio de un logo va de gratis a varios millones de pesos, y casi siempre la diferencia no está en el dibujo sino en lo que te entregan. Te explico los cuatro niveles, qué debe incluir cada uno y cuánto cobro yo.'
  portada:
    imagen: /uploads/proyectos/onces/versiones.jpg
    alt: Cinco versiones del logo de ONCES, de la fachada a un sticker
  etiquetas:
  - Precios
  - Logo
  - Branding
  relacionado: fueggo
  claves:
  - 'Cuando preguntas cuánto cuesta un logo, en realidad preguntas qué te van a entregar: un archivo suelto o un sistema que funcione en todas partes.'
  - 'Hay cuatro niveles: hacerlo tú en Canva o con IA, un logo suelto de un freelancer, una identidad visual completa y un proyecto de agencia con estrategia.'
  - Pide siempre los archivos vectoriales (AI, SVG o PDF), las versiones del logo y la cesión de derechos por escrito.
  - 'Lo que sube el precio no es el dibujo: son las versiones, el manual, las aplicaciones, las rondas de cambios y la investigación previa.'
  - Mi identidad visual empieza en USD 500, con logo, versiones, manual y aplicaciones, y el precio queda cerrado antes de empezar.
  seo:
    titulo: 'Cuánto cuesta un logo en Colombia: precios y qué incluye'
    descripcion: 'Cuánto cuesta un logo en Colombia según lo que recibes: Canva, freelancer, identidad visual o agencia. Qué debe incluir y qué sube el precio.'
    palabra_clave: cuánto cuesta un logo
  cuerpo: |-
    **¿Cuánto cuesta un logo en Colombia?** Es una de las preguntas que más me hacen, y la respuesta honesta es que puede ir de cero pesos a varios millones. Eso no significa que los diseñadores cobren al azar. Significa que con la palabra «logo» se venden cosas muy distintas: desde un archivo PNG hecho en una tarde hasta un sistema de marca con manual, versiones y aplicaciones listas para producir.

    En este artículo te explico los cuatro niveles de precio que vas a encontrar, qué deberías recibir en cada uno, qué hace subir o bajar una cotización y cuánto cobro yo. No te voy a dar cifras inventadas del mercado, porque cambian mucho según la ciudad, la experiencia y la plataforma. Lo que sí te doy son criterios para comparar cotizaciones sin que te vendan humo.

    ## Primero: qué estás comprando cuando compras un logo

    Antes de comparar precios, compara entregables. Dos cotizaciones con el mismo nombre pueden incluir cosas completamente diferentes:

    - **Un logo suelto**: una sola versión, normalmente en PNG o JPG.
    - **Un logo con versiones**: horizontal, vertical, símbolo solo, en positivo y negativo, en archivos vectoriales.
    - **Una identidad visual**: el logo y sus versiones, más paleta de color, tipografías, recursos gráficos y un manual de marca.
    - **Un proyecto de marca con estrategia**: lo anterior más investigación, posicionamiento, naming y a veces arquitectura de marca para varias líneas.

    Si una cotización es mucho más barata que otra, revisa primero en cuál de estos niveles está. Casi siempre la diferencia de precio se explica ahí.

    ## Nivel 1: hacerlo tú en Canva o con IA

    **Costo: gratis o el valor de una suscripción.** Es la opción más rápida y sirve para validar una idea, abrir una cuenta de Instagram o mostrar algo en una feria.

    El problema es lo que no ves. La [licencia de Canva](https://www.canva.com/licensing-explained/) no permite usar el contenido gratuito ni Pro de su biblioteca en una marca registrada; las excepciones son las fuentes, las formas simples y las líneas. Además, sus plantillas no son exclusivas. Lo explico a fondo en [logo en Canva vs. sistema de marca](/articulos/logo-de-canva-vs-sistema-de-marca/).

    ## Nivel 2: un logo suelto de un freelancer

    **Costo: bajo, y muy variable.** En plataformas de freelance y en redes vas a encontrar logos por muy poco dinero. Pueden ser una buena opción si el diseñador es bueno y tienes claro qué recibes.

    Antes de pagar, pregunta:

    - ¿Me entregas el archivo vectorial (AI, SVG o PDF) o solo PNG?
    - ¿Cuántas versiones incluye: horizontal, vertical, ícono, blanco y negro?
    - ¿Cuántas rondas de cambios están incluidas?
    - ¿El diseño es original o parte de una plantilla?
    - ¿Me cedes los derechos por escrito?

    Muchas veces el logo barato sale caro después, cuando la imprenta te pide «el archivo en vector» y no lo tienes. A veces lo que necesitas ni siquiera es un logo nuevo: en Workana, por ejemplo, me han contratado para **vectorizar un logo que ya existía** y entregar los archivos maestros para todos los usos. Si tu marca ya funciona, puede ser la inversión más inteligente.

    ## Nivel 3: identidad visual completa

    **Aquí es donde trabajo yo. Mi identidad visual empieza en USD 500.** El precio exacto depende del alcance, pero siempre queda cerrado por escrito antes de empezar. Incluye:

    | Entregable | Qué es | Para qué te sirve |
    | --- | --- | --- |
    | Logo y versiones | Horizontal, vertical, ícono, color y monocromático | Que funcione en una fachada y en un sticker |
    | Paleta de color | Colores con códigos para pantalla e impresión | Que tu marca se vea igual en redes y en papel |
    | Tipografías | Para títulos y textos | Que todo lo que publiques tenga la misma voz visual |
    | Manual de marca | Reglas de uso y ejemplos | Que cualquier proveedor la aplique sin deformarla |
    | Aplicaciones | Empaque, uniformes, papelería, redes, fachada | Ver la marca en contexto antes de producir |

    Un ejemplo es [Fueggo](/trabajo/fueggo/), un sistema que diseñé de principio a fin: variantes del logo por fondo y tamaño, una paleta con jerarquía clara y aplicaciones en fachada, caja, uniforme, papelería y stickers, todo documentado para la imprenta. Si quieres ver qué lleva un manual, lo explico en [qué incluye un manual de marca](/articulos/que-incluye-un-manual-de-marca/).

    ## Nivel 4: agencia con estrategia de marca

    **Costo: el más alto.** Una agencia suele sumar investigación de mercado, talleres con tu equipo, posicionamiento, naming, arquitectura de marca y un equipo de varias personas. Tiene sentido para empresas medianas o grandes, lanzamientos con mucha inversión o marcas con varias líneas de producto. Para un negocio que empieza, casi siempre es más de lo que necesita.

    ## Qué hace subir o bajar el precio de un logo

    Cuando compares cotizaciones, fíjate en estos factores:

    - **Número de versiones y aplicaciones.** No es lo mismo un logo que un logo con fachada, empaque y uniformes.
    - **Manual de marca.** Documentar las reglas toma tiempo, pero es lo que protege tu inversión.
    - **Naming.** Si todavía no tienes nombre, crearlo y verificarlo es un trabajo aparte.
    - **Rondas de cambios.** Más rondas incluidas significa más horas.
    - **Investigación.** Revisar la competencia y el cliente ideal antes de dibujar cambia el resultado.
    - **Urgencia.** Un plazo muy corto suele costar más.
    - **Experiencia y portafolio.** Un diseñador con casos reales y resultados medibles cobra distinto que alguien que empieza.

    ## Qué debe incluir la entrega final

    Pagues lo que pagues, no cierres el proyecto sin esto:

    1. **Archivos vectoriales** (AI, SVG o PDF) de todas las versiones.
    2. **Archivos para pantalla** en PNG con fondo transparente.
    3. **Códigos de color** para pantalla (HEX y RGB) e impresión (CMYK).
    4. **Nombres de las tipografías** y dónde conseguirlas o su licencia.
    5. **Cesión de derechos patrimoniales** por escrito, para que la marca sea tuya y puedas registrarla. Para el registro, consulta con un abogado de propiedad intelectual.

    ## ¿Cuándo vale la pena pagar más por un logo?

    Paga por una identidad visual completa cuando vayas a producir algo físico (empaques, fachada, uniformes, etiquetas), cuando vayas a registrar la marca, cuando trabajes con varios proveedores o cuando te compares con la competencia y tu marca se vea improvisada. En esos casos, rehacer después cuesta mucho más que hacerlo bien desde el principio.

    Si solo estás validando una idea, empieza simple y guarda el presupuesto para cuando sepas que el negocio funciona.

    ## Cuánto cobro yo y cómo trabajo

    Mi [identidad visual](/servicios/identidad-visual/) empieza en USD 500. Me cuentas tu negocio, te hago preguntas sobre tu cliente y tu competencia, y en menos de 24 horas te envío una propuesta con alcance, fecha y precio fijo. Sin cobros a mitad de camino. He diseñado marcas para restaurantes, discotecas, ropa urbana y el sector dental, y en Workana tengo 5,0 de 5 en todas mis calificaciones.
  preguntas:
  - pregunta: ¿Cuánto cuesta un logo en Colombia?
    respuesta: Depende de lo que te entreguen. Hacerlo en Canva o con IA puede ser gratis, un logo suelto de un freelancer suele ser económico, una identidad visual completa con manual y aplicaciones cuesta más, y un proyecto de agencia con estrategia es lo más costoso. Mi identidad visual empieza en USD 500.
  - pregunta: ¿Qué archivos me deben entregar con un logo?
    respuesta: Los vectoriales de todas las versiones (AI, SVG o PDF), PNG con fondo transparente, los códigos de color para pantalla e impresión, el nombre de las tipografías y la cesión de derechos por escrito.
  - pregunta: ¿Por qué un diseñador cobra más que otro por un logo?
    respuesta: Por lo que incluye. Las versiones, el manual de marca, las aplicaciones, la investigación, las rondas de cambios y la experiencia cambian el precio mucho más que el dibujo en sí.
  - pregunta: ¿Puedo registrar un logo hecho en Canva?
    respuesta: Según la licencia de Canva, no puedes usar contenido gratuito ni Pro de su biblioteca en una marca registrada; solo las fuentes, las formas simples y las líneas son excepción. Consulta con un abogado de propiedad intelectual antes de registrar.
  - pregunta: ¿Cuánto se demora el diseño de una identidad visual?
    respuesta: Depende del alcance y de las rondas de cambios. Cuando te envío la propuesta, la fecha de entrega queda definida por escrito junto con el precio.
  cta:
    titulo: ¿Cuánto costaría tu marca?
    texto: Cuéntame de tu negocio y en menos de 24 horas te envío alcance, fecha y precio fijo.
