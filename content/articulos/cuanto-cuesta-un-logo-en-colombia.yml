  titulo: 'How much does a logo cost in Colombia? Prices, what''s included and how not to overpay'
  resumen: "A logo can cost anywhere from nothing to several million pesos, and the difference is almost never the drawing itself but what you receive. Here are the four price tiers, what each should include and what I charge."
