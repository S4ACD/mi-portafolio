es:
  titulo: Por qué tu tienda en línea carga lento y cuánto te está costando
  publicado: true
  fecha: '2026-10-19'
  resumen: La tienda de Orbidental tardaba 14 segundos en abrir. Te cuento cómo medir si la tuya tiene el mismo problema, qué suele causarlo y qué hice para llevarla de 40 a 97 en PageSpeed.
  etiquetas:
  - Velocidad web
  - SEO
  - E-commerce
  relacionado: orbidental
  claves:
  - Una mejora de solo 0,1 segundos en la velocidad móvil subió la conversión de tiendas en línea un 8,4 % en un estudio encargado por Google.
  - Mide siempre en la pestaña Celular de PageSpeed Insights. Las métricas que importan son LCP, INP y CLS.
  - 'Las causas más comunes son cuatro: un constructor visual pesado, imágenes sin optimizar, demasiados plugins y un hosting sin caché.'
  - Si el peso viene de la base del sitio, conviene rehacer. Si viene de imágenes o plugins, se puede arreglar.
  - La tienda de Orbidental pasó de 14 segundos a unos 2 segundos y de PageSpeed 40 a 97.
  seo:
    titulo: 'Por qué tu tienda en línea carga lento y cuánto te cuesta'
    descripcion: Cómo medir la velocidad de tu tienda en línea, las 4 causas más comunes de lentitud y el caso real de un e-commerce que pasó de 14 segundos a PageSpeed 97.
    palabra_clave: tienda en línea lenta
  cuerpo: |-
    Cuando empecé a trabajar con Orbidental, una distribuidora de insumos dentales con más de 3.000 productos en línea, su tienda tardaba **14 segundos** en abrir en un celular. Catorce segundos es una eternidad: la mayoría de la gente cierra la pestaña mucho antes de ver el primer precio.

    Lo peor es que nadie lo notaba desde la oficina. En un computador con buen internet el sitio se veía "normal". El problema aparecía donde están los clientes: en el celular, con datos, en la calle.

    ## Cada décima de segundo cuenta

    No es una exageración. En un estudio que Google encargó a 55 y Deloitte, una mejora de apenas **0,1 segundos** en la velocidad móvil subió la conversión de las tiendas en línea un **8,4 %**, y lo que gastaba cada cliente un **9,2 %** ([web.dev, «Milliseconds make millions»](https://web.dev/case-studies/milliseconds-make-millions)).

    Si una décima mueve las ventas así, imagina lo que hacen diez segundos de más. Y hay un costo que no se ve: Google mide la experiencia de tus visitantes y la tiene en cuenta para decidir a quién muestra primero.

    ## Cómo saber si tu sitio es lento

    No necesitas saber de programación. Haz esto hoy:

    1. Entra a [PageSpeed Insights](https://pagespeed.web.dev/) y pega la dirección de tu tienda.
    2. Mira la pestaña **Celular**, no la de escritorio. Ahí es donde se pierde la mayoría de clientes.
    3. Busca el recuadro de **Métricas web esenciales** (Core Web Vitals). Si dice «No aprobado», Google ya está viendo un problema real en las visitas de tu sitio.
    4. Abre tu tienda en tu propio celular, con datos y fuera de casa. Cuenta los segundos hasta que puedes tocar un producto.

    Estos son los tres números que Google considera buenos ([web.dev, «Web Vitals»](https://web.dev/articles/vitals)):

    | Métrica | Qué mide | Bueno |
    | --- | --- | --- |
    | LCP | Cuánto tarda en aparecer lo más importante de la pantalla | 2,5 segundos o menos |
    | INP | Cuánto tarda la página en responder cuando tocas algo | 200 milisegundos o menos |
    | CLS | Cuánto «salta» el contenido mientras carga | 0,1 o menos |

    ## Las cuatro causas más comunes

    En casi todas las tiendas lentas que reviso aparece al menos una de estas:

    - **Un constructor visual pesado.** Herramientas como Divi, Elementor o similares son cómodas para armar páginas sin programar, pero cargan mucho código que tu página no usa. En Orbidental eran más de un megabyte de código sobrante en cada visita.
    - **Imágenes sin optimizar.** Fotos de producto de varios megas, en formatos viejos y del mismo tamaño para el celular que para una pantalla gigante.
    - **Demasiados plugins y scripts de terceros.** Chats, pixeles, sliders y ventanas emergentes que se suman uno a uno hasta que la página no puede con todo.
    - **Un hosting o una configuración que no ayuda.** Sin caché, sin compresión y con un servidor lejos de tus clientes.

    ## Lo que hice en Orbidental

    El problema de Orbidental no se arreglaba con un plugin de velocidad: el peso estaba en el propio constructor. Así que reconstruí la tienda en código limpio sobre WordPress, sin Divi.

    Durante mes y medio migré los más de 3.000 productos cuidando cada dirección (URL), cada texto y cada señal técnica. Esa parte es la que más miedo da, y con razón: un error ahí y se caen meses de posicionamiento en Google. También optimicé las imágenes para que cada celular reciba el tamaño y el formato que necesita, y rehice el diseño para que se viera tan serio como la empresa.

    > En un mes, el reporte de Google pasó de «No aprobado» a «Aprobado», y el PageSpeed subió de 40 a 97.

    ![Historial de Métricas web esenciales de Orbidental en Google Search Console](https://res.cloudinary.com/dg2wnq6ao/image/upload/v1782220149/Core_web_vitals_sumart_vttkmm.png "Historial de Métricas web esenciales de Orbidental en Google Search Console: la mejora se sostiene mes a mes.")

    Hoy la tienda abre en unos 2 segundos en el celular, tiene 96 en accesibilidad y 100 en SEO técnico, y el historial de Google muestra que la mejora se mantiene. Además, el tráfico aumentó.

    ## ¿Arreglar o rehacer?

    No siempre hay que empezar de cero. Mi regla es sencilla:

    - **Se puede arreglar** si el sitio está bien construido y el problema son imágenes pesadas, plugins de más o falta de caché. Ahí unas semanas de ajustes bien hechos cambian los números.
    - **Conviene rehacer** si el peso viene de la base, como un constructor visual o una plantilla que carga todo en todas las páginas. Puedes ponerle parches, pero el techo de velocidad sigue siendo bajo.

    En los dos casos, lo primero es medir. Sin números, cualquier cambio es una apuesta.

    ## Errores comunes al intentar acelerar una tienda

    Cuando una tienda en línea está lenta, lo primero que mucha gente hace es instalar otro plugin. A veces ayuda un poco, pero estos errores son muy frecuentes:

    - **Sumar un plugin de velocidad encima de otro.** Dos sistemas de caché o de optimización pueden pelearse entre sí y romper el sitio.
    - **Medir solo en escritorio.** La versión de computador casi siempre sale mejor. Tus clientes compran desde el celular.
    - **Comprimir las fotos hasta que se ven mal.** El objetivo es servir el tamaño correcto y un formato moderno como WebP o AVIF, no arruinar la foto del producto.
    - **Cambiar direcciones (URL) sin redirecciones.** Si rehaces la tienda y las páginas cambian de dirección sin redirigir las antiguas, Google pierde el rastro y el tráfico cae.

    ## Velocidad, SEO y búsquedas con IA

    La velocidad también pesa en cómo te encuentran. Google recomienda ofrecer una buena experiencia de página, y una tienda lenta pierde visitas antes de que el cliente vea un producto. Con las respuestas de IA pasa algo parecido: necesitan leer tu contenido en texto y que tu sitio responda bien. Te lo explico en [cómo aparecer en ChatGPT y en Google](/articulos/como-aparecer-en-chatgpt-y-google/).

    ## Para empezar hoy

    - Mide tu tienda en PageSpeed Insights, en la pestaña Celular.
    - Abre tu sitio desde tu celular con datos y cuenta los segundos.
    - Revisa el peso de las fotos de tus productos más vistos.
    - Haz la lista de plugins y scripts instalados y quita los que nadie usa.
    - Si las Métricas web esenciales no aparecen como aprobadas, ya tienes una razón concreta para actuar.

    Si quieres, envíame la dirección de tu tienda y te digo qué haría yo primero. También puedes ver cómo trabajo el [diseño y desarrollo web](/servicios/diseno-web/) o pedir una [auditoría SEO + GEO](/servicios/auditoria-seo-geo/) para medir todo el sitio.
  preguntas:
  - pregunta: ¿Cuánto debe tardar en cargar una tienda en línea?
    respuesta: Google considera bueno que lo más importante de la pantalla aparezca en 2,5 segundos o menos (LCP), que la página responda en 200 milisegundos o menos (INP) y que el contenido casi no salte mientras carga (CLS de 0,1 o menos).
  - pregunta: ¿Cómo mido la velocidad de mi tienda?
    respuesta: Entra a PageSpeed Insights, pega la dirección de tu tienda y mira la pestaña Celular. Revisa también el recuadro de Métricas web esenciales, que muestra datos de visitas reales.
  - pregunta: ¿La velocidad afecta el SEO?
    respuesta: Sí. Google tiene en cuenta la experiencia de página, y una tienda lenta pierde visitas y ventas antes de que el cliente vea los productos.
  - pregunta: ¿Un plugin de velocidad soluciona el problema?
    respuesta: Ayuda cuando el problema es la caché o las imágenes. Si el peso viene de un constructor visual o de la plantilla, el plugin solo pone un parche y el límite de velocidad sigue siendo bajo.
  - pregunta: ¿Rehacer la tienda hace perder posicionamiento en Google?
    respuesta: Puede pasar si se cambian las direcciones sin redirecciones o se pierden textos y datos técnicos. Con una migración cuidadosa, como la de los más de 3.000 productos de Orbidental, el posicionamiento se mantiene.
en:
  titulo: Why your online store loads slowly and what it's costing you
  resumen: "Orbidental's online store took 14 seconds to open. Here's how to check whether yours has the same problem, what usually causes it and what I did to take it from 40 to 97 on PageSpeed."
  etiquetas:
  - Web speed
  - SEO
  - E-commerce
  claves:
  - Improving mobile speed by just 0.1 seconds raised retail conversion by 8.4% in a study commissioned by Google.
  - Always measure on the Mobile tab in PageSpeed Insights. The metrics that matter are LCP, INP and CLS.
  - 'The four most common causes are a heavy page builder, unoptimized images, too many plugins and hosting without caching.'
  - If the weight comes from the site's foundation, rebuild it. If it comes from images or plugins, it can be fixed.
  - Orbidental's store went from 14 seconds to about 2 seconds, and from PageSpeed 40 to 97.
  seo:
    titulo: 'Why your online store loads slowly (and what it costs)'
    descripcion: 'How to measure your online store’s speed, the 4 most common causes of a slow site and a real case that went from 14 seconds to PageSpeed 97.'
    palabra_clave: slow online store
  cuerpo: |-
    When I started working with Orbidental, a dental supply distributor with more than 3,000 products online, its store took **14 seconds** to open on a phone. Fourteen seconds is an eternity: most people close the tab long before they see the first price.

    The worst part is that nobody noticed it from the office. On a computer with good internet the site looked "fine". The problem showed up where the customers are: on their phones, on mobile data, out on the street.

    ## Every tenth of a second counts

    This isn't an exaggeration. In a study Google commissioned from 55 and Deloitte, improving mobile speed by just **0.1 seconds** raised conversion on retail sites by **8.4%**, and how much each customer spent by **9.2%** ([web.dev, "Milliseconds make millions"](https://web.dev/case-studies/milliseconds-make-millions)).

    If a tenth of a second moves sales like that, imagine what ten extra seconds do. And there's a hidden cost too: Google measures your visitors' experience and takes it into account when deciding who to show first.

    ## How to tell if your site is slow

    You don't need to know how to code. Do this today:

    1. Go to [PageSpeed Insights](https://pagespeed.web.dev/) and paste your store's address.
    2. Look at the **Mobile** tab, not desktop. That's where most customers are lost.
    3. Find the **Core Web Vitals** box. If it says "Failed", Google is already seeing a real problem in your site's visits.
    4. Open your store on your own phone, on mobile data and away from home. Count the seconds until you can tap a product.

    These are the three numbers Google considers good ([web.dev, "Web Vitals"](https://web.dev/articles/vitals)):

    | Metric | What it measures | Good |
    | --- | --- | --- |
    | LCP | How long the most important part of the screen takes to appear | 2.5 seconds or less |
    | INP | How long the page takes to respond when you tap something | 200 milliseconds or less |
    | CLS | How much the content "jumps" while it loads | 0.1 or less |

    ## The four most common causes

    Almost every slow store I review has at least one of these:

    - **A heavy page builder.** Tools like Divi or Elementor make it easy to build pages without code, but they load a lot of code your page doesn't use. At Orbidental it was more than a megabyte of unused code on every visit.
    - **Unoptimized images.** Product photos weighing several megabytes, in old formats, and the same size for a phone as for a giant screen.
    - **Too many plugins and third-party scripts.** Chats, pixels, sliders and pop-ups that add up one by one until the page can't handle them all.
    - **Hosting or settings that don't help.** No caching, no compression and a server far from your customers.

    ## What I did at Orbidental

    Orbidental's problem couldn't be fixed with a speed plugin: the weight was in the page builder itself. So I rebuilt the store in clean code on WordPress, without Divi.

    Over six weeks I migrated more than 3,000 products, taking care of every address (URL), every piece of text and every technical signal. That's the scary part, and for good reason: one mistake there and months of Google rankings disappear. I also optimized the images so each phone gets the size and format it needs, and redesigned the store so it looked as serious as the company.

    > Within a month, Google's report went from "Failed" to "Passed", and PageSpeed went from 40 to 97.

    ![Orbidental Core Web Vitals history in Google Search Console](https://res.cloudinary.com/dg2wnq6ao/image/upload/v1782220149/Core_web_vitals_sumart_vttkmm.png "Orbidental's Core Web Vitals history in Google Search Console: the improvement holds month after month.")

    Today the store opens in about 2 seconds on a phone, scores 96 for accessibility and 100 for technical SEO, and Google's history shows the improvement is holding. Traffic went up too.

    ## Fix it or rebuild it?

    You don't always have to start from scratch. My rule is simple:

    - **It can be fixed** if the site is well built and the problem is heavy images, too many plugins or no caching. A few weeks of careful work can change the numbers.
    - **It's better to rebuild** if the weight comes from the foundation, like a page builder or a theme that loads everything on every page. You can patch it, but the speed ceiling stays low.

    Either way, the first step is to measure. Without numbers, any change is a guess.

    ## Common mistakes when trying to speed up a store

    When an online store is slow, the first thing many people do is install another plugin. Sometimes it helps a little, but these mistakes are very common:

    - **Stacking one speed plugin on top of another.** Two caching or optimization systems can conflict with each other and break the site.
    - **Only measuring on desktop.** The desktop version almost always scores better. Your customers buy from their phones.
    - **Compressing photos until they look bad.** The goal is to serve the right size and a modern format like WebP or AVIF, not to ruin the product photo.
    - **Changing addresses (URLs) without redirects.** If you rebuild the store and pages move to new addresses without redirecting the old ones, Google loses track and traffic drops.

    ## Speed, SEO and AI search

    Speed also affects how people find you. Google recommends offering a good page experience, and a slow store loses visits before customers see a single product. AI answers work in a similar way: they need to read your content as text and need your site to respond well. I explain it in [how to show up in ChatGPT and Google](/en/articulos/como-aparecer-en-chatgpt-y-google/).

    ## To start today

    - Test your store on PageSpeed Insights, on the Mobile tab.
    - Open your site on your phone with mobile data and count the seconds.
    - Check the file size of the photos for your most-viewed products.
    - List the plugins and scripts you have installed and remove the ones nobody uses.
    - If Core Web Vitals don't show as passed, you already have a concrete reason to act.

    If you'd like, send me your store's address and I'll tell you what I would do first. You can also see how I handle [web design and development](/en/servicios/diseno-web/) or book an [SEO + GEO audit](/en/servicios/auditoria-seo-geo/) to measure the whole site.
  preguntas:
  - pregunta: How fast should an online store load?
    respuesta: Google considers it good when the most important part of the screen appears in 2.5 seconds or less (LCP), the page responds in 200 milliseconds or less (INP) and the content barely shifts while loading (CLS of 0.1 or less).
  - pregunta: How do I measure my store's speed?
    respuesta: Go to PageSpeed Insights, paste your store's address and look at the Mobile tab. Also check the Core Web Vitals box, which shows data from real visits.
  - pregunta: Does speed affect SEO?
    respuesta: Yes. Google takes page experience into account, and a slow store loses visits and sales before customers see the products.
  - pregunta: Will a speed plugin fix the problem?
    respuesta: It helps when the problem is caching or images. If the weight comes from a page builder or the theme, the plugin is just a patch and the speed ceiling stays low.
  - pregunta: Will rebuilding my store hurt my Google rankings?
    respuesta: It can if addresses change without redirects or if text and technical signals get lost. With a careful migration, like the one for Orbidental's 3,000+ products, rankings hold.
