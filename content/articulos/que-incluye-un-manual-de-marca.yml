es:
  titulo: Qué incluye un manual de marca y por qué tu negocio lo necesita
  publicado: true
  fecha: '2026-10-19'
  resumen: 'Un manual de marca no es un PDF bonito para guardar en una carpeta. Es la herramienta que evita que tu logo se deforme, que cada proveedor use colores distintos y que tu marca se vea improvisada. Te explico qué debe incluir, sección por sección.'
  portada:
    imagen: /uploads/proyectos/onces/portada.jpg
    alt: Portada del manual de marca de ONCES con el logo y un cono de crepe junto a un vaso de chocolate
  etiquetas:
  - Manual de marca
  - Branding
  - Identidad visual
  relacionado: onces
  claves:
  - Un manual de marca es el conjunto de reglas que permite que cualquier persona aplique tu identidad sin deformarla.
  - 'Las secciones básicas son: logo y sus versiones, área de protección, color con proporciones, tipografía, recursos gráficos, voz y aplicaciones.'
  - Lo que más se olvida es probar el logo en tamaños extremos, desde una fachada hasta un sticker de pocos milímetros.
  - Un buen manual le ahorra dinero a tu negocio porque elimina el retrabajo con cada imprenta, diseñador o proveedor nuevo.
  - No necesita cientos de páginas. El de ONCES tiene 32 y cubre una marca completa con empaques.
  seo:
    titulo: 'Qué incluye un manual de marca: guía con ejemplos'
    descripcion: 'Qué es un manual de marca, qué secciones debe tener (logo, color, tipografía, voz y aplicaciones), cuántas páginas necesita y cuándo lo necesitas.'
    palabra_clave: manual de marca
  cuerpo: |-
    Un **manual de marca** es el documento que reúne las reglas de tu identidad visual: cómo se usa el logo, qué colores van y en qué proporción, qué tipografías se usan, cómo suena la marca cuando habla y cómo se ve aplicada en piezas reales. Su trabajo es simple y muy valioso: que cualquier persona, sea una imprenta, un diseñador nuevo o tu equipo de redes, pueda usar tu marca sin deformarla.

    Muchos negocios lo ven como un lujo de empresas grandes. En realidad es al revés: un negocio pequeño es el que menos puede pagar el desorden de rehacer piezas, reimprimir empaques o explicarle lo mismo a cada proveedor. En este artículo te explico qué incluye un manual de marca, sección por sección, con ejemplos de dos sistemas que diseñé: [ONCES](/trabajo/onces/) y [Fueggo](/trabajo/fueggo/).

    ## Qué es un manual de marca (y qué no es)

    Un manual de marca, también llamado manual de identidad o *brand book*, **no es una presentación del logo**. Mostrar el logo sobre un fondo bonito es un *moodboard*. El manual dice cómo usarlo, cuándo usar cada versión, cómo no usarlo y qué hacer en los casos difíciles.

    Tampoco es un documento de estrategia de cientos de páginas. Para la mayoría de negocios, un manual claro de 20 a 40 páginas cubre todo lo que hace falta. El de ONCES, una crepería bogotana que diseñé como proyecto conceptual, tiene **32 páginas** e incluye la marca completa y ocho empaques.

    ## Señales de que tu negocio necesita un manual de marca

    - Tu logo se ve distinto en el letrero, en Instagram y en la factura.
    - Cada vez que mandas algo a imprimir tienes que buscar «el archivo bueno» del logo.
    - Cambiaste de diseñador y las piezas nuevas no se parecen a las anteriores.
    - Tu equipo usa colores «parecidos» porque nadie sabe cuáles son los oficiales.
    - Vas a abrir otro punto, lanzar un producto o hacer empaques y quieres que todo se vea de la misma marca.

    Si te identificas con dos o más, el manual te va a ahorrar tiempo y dinero desde el primer pedido.

    ## Las secciones de un manual de marca

    ### 1. Logo, versiones y construcción

    Esta es la base. Un manual de marca serio no entrega un solo logo: entrega **una familia de versiones** pensada para cada situación. En ONCES son cinco, desde la fachada hasta un sticker de 8 mm. En Fueggo diseñé variantes por fondo y por tamaño, porque el logo tenía que vivir en una caja de cartón, en tela de uniforme y en una fachada de varios metros.

    La sección incluye:

    - **La versión principal** y las alternativas: horizontal, vertical, símbolo solo.
    - **La construcción**: la retícula y las proporciones con las que se dibujó el logo, para que nadie lo redibuje «a ojo».
    - **Las versiones en positivo y negativo**: cómo se ve sobre fondo claro y sobre fondo oscuro.
    - **El tamaño mínimo**: desde qué medida deja de leerse y hay que pasar a la versión simplificada.

    ### 2. Área de protección y usos incorrectos

    El área de protección es el espacio vacío que siempre debe rodear el logo para que respire. Sin esa regla, el logo termina pegado al borde de la página o tapado por un texto. Se define con una medida que sale del propio logo, por ejemplo la altura de una letra, para que funcione a cualquier escala.

    Los **usos incorrectos** muestran lo que no se debe hacer: estirarlo, girarlo, cambiarle el color, ponerle sombras o usarlo sobre una foto que no deja leerlo. Parece obvio, pero es la página que más errores evita.

    ### 3. Color: paleta y proporciones

    Una paleta no es solo una lista de colores. Lo que convierte cinco colores en una marca es **la proporción en que se usan**. En ONCES la definí así:

    | Color | Proporción | Uso |
    | --- | --- | --- |
    | Crema | 45 % | Fondo principal |
    | Blanco papel | 25 % | Fondos secundarios y respiro |
    | Rojo peltre | 18 % | Acento y elementos de identidad |
    | Chocolate | 10 % | Textos y contraste |
    | Mostaza | 2 % | Detalle puntual |

    Con esa tabla, cualquier diseñador entiende que la mostaza es un detalle y no un fondo. En Fueggo la jerarquía fue igual de explícita: qué color va de fondo, cuál es el acento y cuál se reserva para detalles. La sección también incluye los códigos de cada color para pantalla (HEX y RGB) e impresión (CMYK y, si aplica, Pantone), porque un rojo en Instagram y un rojo impreso en cartón no se logran con el mismo valor.

    ### 4. Tipografía

    Aquí se definen las familias tipográficas, para qué se usa cada una y cómo se ordenan los textos. En ONCES: **Fraunces** para titulares, **DM Sans** para textos, y el lettering propio reservado solo para el logo. Esa última regla es clave: si el lettering del logo se usa para todo, el logo deja de ser especial.

    Un buen manual también indica tamaños relativos, interlineado y alternativas gratuitas o del sistema por si alguien no tiene las fuentes instaladas.

    ### 5. Recursos gráficos

    Son los elementos que identifican la marca **sin necesidad del logo**: patrones, texturas, ilustraciones, íconos, bordes o formas. En ONCES son cinco: el croché, el borde rojo peltre, el despique, la sombra de rótulo y el 11 escondido. Si alguien ve un empaque de lado, sin el logo a la vista, igual reconoce la marca.

    Esta sección es la que hace que tus redes, tus empaques y tu local se sientan de la misma familia.

    ### 6. Voz y tono

    Una marca también tiene una forma de hablar. La sección de voz define el tono, las palabras que se usan y las que no, y da ejemplos reales. La voz de ONCES mezcla datos de artesano con humor rolo: «Masa reposada 24 horas. Más que usted un domingo.». Con un ejemplo así, quien escribe los posts entiende el tono mejor que con cualquier lista de adjetivos.

    ### 7. Aplicaciones

    Es la prueba de fuego: el sistema puesto en piezas reales. En Fueggo diseñé fachada, caja de empaque, uniforme, papelería y stickers. En ONCES, ocho piezas de empaque **producibles en Colombia** con cartón y papel, con un orden de producción por fases para no comprometer la caja del primer año.

    Las aplicaciones sirven de ejemplo y también de especificación: medidas, materiales y acabados para que la imprenta no tenga que adivinar.

    ## Lo que más se olvida en un manual de marca

    - **Los tamaños extremos.** Un logo puede verse perfecto en la pantalla y desaparecer bordado en una camiseta o impreso en una etiqueta de 3 cm. Hay que probarlo en grande y en pequeño.
    - **Los materiales reales.** El cartón kraft cambia los colores, la tela absorbe la tinta y una fachada se ve con luz de día y de noche.
    - **Los archivos.** Un manual sin la carpeta de archivos (vectores, versiones en PNG, fuentes y paletas) obliga a pedir todo otra vez.
    - **Quién lo va a usar.** El manual debe estar escrito para la imprenta y para tu equipo, no solo para diseñadores.

    ## Manual de marca, logo y sistema de identidad: la diferencia

    Un **logo** es una pieza. Un **sistema de identidad** es el conjunto de logo, color, tipografía, recursos y voz que hacen reconocible a la marca. El **manual de marca** es el documento que explica ese sistema para que se aplique siempre igual. Si solo tienes un logo, el manual no tiene mucho que ordenar. Lo explico con más detalle en [logo de Canva vs. sistema de marca](/articulos/logo-de-canva-vs-sistema-de-marca/).

    ## Cuánto cuesta no tener un manual de marca

    El costo no aparece en una factura, pero se paga: horas buscando archivos, piezas rehechas, empaques reimpresos porque el color salió distinto y una marca que el cliente no termina de reconocer. Cada vez que un proveedor «interpreta» tu marca, la cambia un poco. Después de un año, esas pequeñas diferencias se notan.

    Si quieres un sistema de identidad con su manual listo para producción, mira mi servicio de [identidad visual](/servicios/identidad-visual/). Te entrego el sistema completo, el manual y los archivos para que cualquier proveedor lo aplique sin llamarte.
  preguntas:
  - pregunta: ¿Qué es un manual de marca?
    respuesta: Es el documento que reúne las reglas de una identidad visual, como las versiones del logo, el área de protección, los colores y sus proporciones, la tipografía, los recursos gráficos, la voz y las aplicaciones, para que cualquier persona pueda usar la marca sin deformarla.
  - pregunta: ¿Cuántas páginas debe tener un manual de marca?
    respuesta: Para la mayoría de negocios bastan entre 20 y 40 páginas. Lo importante no es la cantidad, sino que cubra el logo y sus versiones, el color, la tipografía, los recursos gráficos, la voz y ejemplos reales de aplicación.
  - pregunta: ¿Un negocio pequeño necesita un manual de marca?
    respuesta: Sí, sobre todo si trabaja con varios proveedores, imprime empaques o tiene a otra persona manejando redes. El manual evita retrabajos y hace que la marca se vea igual en todas partes.
  - pregunta: ¿Cuál es la diferencia entre manual de marca y brandbook?
    respuesta: En la práctica se usan como sinónimos. Algunos llaman brandbook a un documento más inspiracional y manual de marca a uno más técnico, pero un buen manual combina ambos.
  - pregunta: ¿Qué archivos se entregan con un manual de marca?
    respuesta: Normalmente los vectores del logo y sus versiones (AI, SVG o PDF), los PNG para pantalla, las fuentes o sus enlaces de descarga, los códigos de color y las plantillas de las aplicaciones principales.
  cta:
    titulo: ¿Tu marca necesita reglas claras?
    texto: Cuéntame en qué punto está tu marca y te digo qué secciones del manual necesitas primero.
en:
  titulo: What a brand guidelines manual includes and why your business needs one
  resumen: "A brand guidelines manual isn't a pretty PDF to file away. It's the tool that stops your logo from getting distorted, every supplier from using different colors and your brand from looking improvised. Here's what it should include, section by section."
  portada:
    alt: Cover of the ONCES brand manual with the logo and a crêpe cone next to a cup of hot chocolate
  etiquetas:
  - Brand guidelines
  - Branding
  - Visual identity
  claves:
  - A brand guidelines manual is the set of rules that lets anyone apply your identity without distorting it.
  - 'The core sections are: logo and its versions, clear space, color with proportions, typography, graphic assets, voice and applications.'
  - The most commonly forgotten step is testing the logo at extreme sizes, from a storefront down to a sticker just a few millimeters wide.
  - Good guidelines save your business money because they eliminate rework with every new printer, designer or supplier.
  - It doesn't need hundreds of pages. The ONCES manual has 32 and covers a complete brand with packaging.
  seo:
    titulo: 'What brand guidelines include: a guide with examples'
    descripcion: 'What brand guidelines are, which sections they need (logo, color, typography, voice, applications), how many pages they need and when you need them.'
    palabra_clave: brand guidelines manual
  cuerpo: |-
    A **brand guidelines manual** is the document that gathers the rules of your visual identity: how the logo is used, which colors go where and in what proportion, which typefaces you use, how the brand sounds when it speaks and how it looks on real pieces. Its job is simple and very valuable: anyone, whether a printer, a new designer or your social media team, can use your brand without distorting it.

    Many businesses see it as a luxury for big companies. It's actually the other way around: a small business is the one that can least afford the mess of redoing pieces, reprinting packaging or explaining the same thing to every supplier. In this article I explain what a brand guidelines manual includes, section by section, with examples from two systems I designed: [ONCES](/en/trabajo/onces/) and [Fueggo](/en/trabajo/fueggo/).

    ## What brand guidelines are (and what they aren't)

    A brand guidelines manual, also called a brand book or identity manual, **is not a logo presentation**. Showing the logo on a nice background is a moodboard. The manual tells you how to use it, when to use each version, how not to use it and what to do in tricky cases.

    It isn't a strategy document hundreds of pages long, either. For most businesses, a clear 20- to 40-page manual covers everything that's needed. The one for ONCES, a Bogotá crêperie I designed as a concept project, has **32 pages** and includes the full brand and eight packaging pieces.

    ## Signs your business needs brand guidelines

    - Your logo looks different on your sign, on Instagram and on your invoices.
    - Every time you send something to print, you have to hunt for "the right file" of the logo.
    - You changed designers and the new pieces don't look like the old ones.
    - Your team uses "similar" colors because nobody knows the official ones.
    - You're opening another location, launching a product or making packaging, and you want everything to look like the same brand.

    If two or more of these sound familiar, guidelines will save you time and money from the very first order.

    ## The sections of a brand guidelines manual

    ### 1. Logo, versions and construction

    This is the foundation. Serious brand guidelines don't deliver a single logo: they deliver **a family of versions** designed for every situation. ONCES has five, from the storefront down to an 8 mm sticker. For Fueggo I designed variants by background and by size, because the logo had to live on a cardboard box, on uniform fabric and on a storefront several meters wide.

    This section includes:

    - **The primary version** and the alternates: horizontal, vertical, symbol only.
    - **The construction**: the grid and proportions the logo was drawn on, so nobody redraws it by eye.
    - **Positive and negative versions**: how it looks on light and on dark backgrounds.
    - **The minimum size**: the point at which it stops being legible and you need to switch to the simplified version.

    ### 2. Clear space and incorrect uses

    Clear space is the empty area that must always surround the logo so it can breathe. Without that rule, the logo ends up jammed against the edge of the page or covered by text. It's defined with a measurement taken from the logo itself, such as the height of one letter, so it works at any scale.

    **Incorrect uses** show what not to do: stretching it, rotating it, changing its color, adding shadows or placing it on a photo that makes it hard to read. It seems obvious, but it's the page that prevents the most mistakes.

    ### 3. Color: palette and proportions

    A palette isn't just a list of colors. What turns five colors into a brand is **the proportion in which they're used**. For ONCES I defined it like this:

    | Color | Proportion | Use |
    | --- | --- | --- |
    | Cream | 45% | Main background |
    | Paper white | 25% | Secondary backgrounds and breathing room |
    | Enamel red | 18% | Accent and identity elements |
    | Chocolate | 10% | Text and contrast |
    | Mustard | 2% | Occasional detail |

    With that table, any designer understands that mustard is a detail and not a background. For Fueggo the hierarchy was just as explicit: which color is the background, which one is the accent and which one is reserved for details. This section also includes the codes for each color on screen (HEX and RGB) and in print (CMYK and, where relevant, Pantone), because a red on Instagram and a red printed on cardboard aren't achieved with the same value.

    ### 4. Typography

    Here you define the type families, what each one is for and how text is organized. For ONCES: **Fraunces** for headlines, **DM Sans** for body text, and the custom lettering reserved for the logo only. That last rule is key: if the logo's lettering is used for everything, the logo stops being special.

    Good guidelines also specify relative sizes, line spacing and free or system alternatives in case someone doesn't have the fonts installed.

    ### 5. Graphic assets

    These are the elements that identify the brand **without needing the logo**: patterns, textures, illustrations, icons, borders or shapes. ONCES has five: the crochet, the enamel-red rim, the chip, the sign-painter shadow and the hidden 11. If someone sees a package from the side, with no logo in sight, they still recognize the brand.

    This is the section that makes your social media, your packaging and your shop feel like one family.

    ### 6. Voice and tone

    A brand also has a way of speaking. The voice section defines the tone, the words you use and the ones you avoid, and gives real examples. The ONCES voice mixes artisan facts with Bogotá humor: "Dough rested 24 hours. Longer than you on a Sunday." With an example like that, whoever writes the posts gets the tone better than with any list of adjectives.

    ### 7. Applications

    This is the real test: the system on actual pieces. For Fueggo I designed the storefront, takeout box, uniform, stationery and stickers. For ONCES, eight packaging pieces **that can be produced in Colombia** with cardboard and paper, with a phased production order so the first year's cash flow isn't put at risk.

    Applications work as examples and also as specifications: sizes, materials and finishes so the printer doesn't have to guess.

    ## What brand guidelines most often leave out

    - **Extreme sizes.** A logo can look perfect on screen and disappear when embroidered on a T-shirt or printed on a 3 cm label. It has to be tested big and small.
    - **Real materials.** Kraft cardboard shifts colors, fabric absorbs ink, and a storefront is seen in daylight and at night.
    - **The files.** Guidelines without the file folder (vectors, PNG versions, fonts and palettes) mean you have to ask for everything again.
    - **Who will use it.** The manual should be written for the printer and for your team, not just for designers.

    ## Brand guidelines, logo and identity system: the difference

    A **logo** is one piece. An **identity system** is the set of logo, color, typography, assets and voice that make the brand recognizable. The **brand guidelines manual** is the document that explains that system so it's always applied the same way. If all you have is a logo, there isn't much for a manual to organize. I go into more detail in [Canva logo vs. brand system](/en/articulos/logo-de-canva-vs-sistema-de-marca/).

    ## What it costs not to have brand guidelines

    The cost doesn't show up on an invoice, but you pay it: hours spent looking for files, pieces redone, packaging reprinted because the color came out wrong, and a brand customers never quite recognize. Every time a supplier "interprets" your brand, they change it a little. After a year, those small differences show.

    If you want an identity system with guidelines that are ready for production, take a look at my [visual identity](/en/servicios/identidad-visual/) service. I deliver the complete system, the manual and the files so any supplier can apply it without calling you.
  preguntas:
  - pregunta: What is a brand guidelines manual?
    respuesta: It's the document that gathers the rules of a visual identity, such as logo versions, clear space, colors and their proportions, typography, graphic assets, voice and applications, so anyone can use the brand without distorting it.
  - pregunta: How many pages should brand guidelines have?
    respuesta: For most businesses, 20 to 40 pages is enough. What matters isn't the page count but covering the logo and its versions, color, typography, graphic assets, voice and real application examples.
  - pregunta: Does a small business need brand guidelines?
    respuesta: Yes, especially if it works with several suppliers, prints packaging or has someone else running social media. Guidelines prevent rework and keep the brand looking the same everywhere.
  - pregunta: What's the difference between brand guidelines and a brand book?
    respuesta: In practice the terms are used interchangeably. Some people call a more inspirational document a brand book and a more technical one brand guidelines, but a good manual combines both.
  - pregunta: Which files come with brand guidelines?
    respuesta: Usually the logo vectors and versions (AI, SVG or PDF), PNGs for screens, the fonts or their download links, the color codes and templates for the main applications.
  cta:
    titulo: Does your brand need clear rules?
    texto: Tell me where your brand stands today and I'll tell you which sections of the manual you need first.
