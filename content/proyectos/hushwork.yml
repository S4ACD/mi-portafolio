en:
  nombre: Hushwork
  alt: White Hushwork pickup with a large “Shh.” outside a condo building
  resumen: 'A bilingual identity for a condo renovation company in Houston and Miami that promises what nobody sells: work you never hear.'
  disciplinas:
  - Branding
  - Bilingual voice
  - Landing page
  seo:
    titulo: Hushwork — Identity for a Condo Renovation Company in Houston and Miami | Alexander Caro
    descripcion: 'Concept project: a bilingual brand for a father-and-son renovation company. Logo, English and Spanish voice, truck, uniforms, door hanger, quote and landing page.'
  caso:
    intro: 'Renovating a condo isn''t a design problem, it''s a neighbor problem. Hushwork is a fictional father-and-son company competing with national franchises on one simple promise: you''ll notice the results, not the work.'
    ficha:
    - etiqueta: Role
      valor: Strategy, identity, bilingual voice and landing page
    - etiqueta: Deliverables
      valor: Brand manual, street and on-site applications, quote and landing page for desktop and mobile
    - etiqueta: Market
      valor: Houston and Miami, in English and Spanish
    bloques:
    - tipo: texto
      titulo: The insight
      texto: |-
        Condo owners worry about the HOA, noise, hallway dust and their neighbors. Franchises sell scale; nobody sells peace of mind to the people next door.

        That is the brand's space: "Loud results. Quiet work."
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/hushwork/shh.jpg
      alt: The Hushwork “Shh.” as brand concept
      pie: The concept in one syllable.
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: /uploads/proyectos/hushwork/logo.jpg
        alt: Hushwork logo with its square period
        pie: 'A violet square period: silence and finished work. It is the only color in the logo.'
      - imagen: /uploads/proyectos/hushwork/versiones.jpg
        alt: Hushwork logo variations
        pie: Horizontal, stacked, the “h.” icon and one-color versions.
    - tipo: colores
      titulo: Palette and proportion of use
      colores:
      - nombre: Plaster
        hex: '#F2F0EB'
        proporcion: 55
      - nombre: Ink
        hex: '#1C1D1F'
        proporcion: 30
      - nombre: Concrete
        hex: '#A7A39B'
        proporcion: 10
      - nombre: Hush Violet
        hex: '#7B61FF'
        proporcion: 5
    - tipo: texto
      titulo: One voice, two languages
      texto: |-
        English comes first and Spanish follows at the same size and weight, never as a small italic translation. Lines are adapted, not translated.

        Short sentences, dry humor and hard facts: "Day 9 update: the tile arrived cracked. New batch lands Thursday. Your finish date holds."
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: /uploads/proyectos/hushwork/yard-sign.jpg
        alt: Hushwork yard sign outside a house
        pie: 'The yard sign promises neighbors what they fear most: no noise.'
      - imagen: /uploads/proyectos/hushwork/uniformes.jpg
        alt: 'Hushwork uniforms: tee, polo and cap'
        pie: Plaster polo for quotes, Ink tee for the job site.
      - imagen: /uploads/proyectos/hushwork/kit-de-obra.jpg
        alt: Job-site kit with tape, shoe covers and a welcome card
        pie: 'The job-site kit: tape, shoe covers and “Welcome home”.'
      - imagen: /uploads/proyectos/hushwork/ascensor.jpg
        alt: Elevator screen with a Hushwork message
        pie: The elevator that talks.
      - imagen: /uploads/proyectos/hushwork/antes-despues.jpg
        alt: Before and after of a bathroom renovated by Hushwork
        pie: Before and after, in morning light with the finished space empty.
      - imagen: /uploads/proyectos/hushwork/tarjeta-door-hanger.jpg
        alt: Hushwork business card and door hanger
        pie: The door hanger turns the neighbors' biggest complaint into a lead channel.
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/hushwork/cotizacion.jpg
      alt: Hushwork quote with line items and a 21-day schedule
      pie: 'The quote ties the second payment to the waterproofing test: clients pay for results, not dates.'
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: /uploads/proyectos/hushwork/landing.jpg
        alt: Hushwork landing page on desktop
        pie: Landing page on desktop.
      - imagen: /uploads/proyectos/hushwork/landing-movil.jpg
        alt: Hushwork landing page on mobile
        pie: And on mobile.
    creditos: |-
      Strategy, identity, voice and landing page design: Alexander Caro.

      Concept project: Hushwork, its founders and its clients are fictional. Base mockup photography was generated with AI; the logo, graphics and brand system are my own design.
