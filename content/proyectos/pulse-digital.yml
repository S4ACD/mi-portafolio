    titulo: Pulse Digital — Diseño web para mercado internacional | Alexander Caro
    descripcion: Cómo construí desde cero la identidad y la landing de Pulse Digital, un concepto de agencia de marketing premium en inglés — prueba de versatilidad visual y ejecución técnica para mercado internacional.
  caso:
    intro: Una identidad de agencia premium construida desde cero — en inglés, para clientes internacionales, sin un solo elemento heredado de mi propia marca.
    ficha:
    - etiqueta: Cliente
      valor: Pulse Digital (concepto)
