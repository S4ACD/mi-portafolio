en:
  nombre: Logofolio I
  alt: Logofolio I logo mosaic
  resumen: Twenty fictional brands across five industries, each logo built from a real detail of the craft or the place.
  disciplinas:
  - Logo design
  - Branding
  - Lettering
  resultado:
    cifra: '20'
    texto: brands, each with its own concept
  seo:
    titulo: Logofolio I — 20 Brands, Each With Its Own Concept | Alexander Caro
    descripcion: Twenty logos for fictional brands across five industries, from a filigree maker in Mompox to a cats-only clinic in Montevideo. Each one grows from a detail of the craft or the place.
  caso:
    intro: 'Twenty fictional brands across five industries. The rule was the same for all of them: the logo has to come from the craft or the place, never from a template. A filigree draw plate in Mompox, a comma in a contract, the cedar ball outside a sake brewery.'
    ficha:
    - etiqueta: Role
      valor: Naming, concept and logo design
    - etiqueta: Deliverables
      valor: 20 logos with versions, palette, typography and application
    bloques:
    - tipo: galeria
      columnas: 4
      titulo: Luxury
      imagenes:
      - imagen: /uploads/proyectos/logofolio/marca-01.jpg
        alt: Hilera logo, filigree jewelry in Mompox, Colombia
        pie: '**Hilera**. Filigree jewelry, Mompox, Colombia'
        texto: The name runs through the draw plate filigree makers use to thin silver into wire.
      - imagen: /uploads/proyectos/logofolio/marca-02.jpg
        alt: Sondhi logo, mitti attar perfume in Kannauj, India
        pie: '**Sondhi**. Mitti attar perfume, Kannauj, India'
        texto: 'The word is written in the cracks of a dry pond: the moment before the first rain, which is what the house bottles.'
      - imagen: /uploads/proyectos/logofolio/marca-03.jpg
        alt: Gereh logo, hand-knotted rugs in Kashan, Iran
        pie: '**Gereh**. Hand-knotted rugs, Kashan, Iran'
        texto: 'The G isn''t written, it''s woven: a single thread goes over and under the warp, like on the loom.'
      - imagen: /uploads/proyectos/logofolio/marca-04.jpg
        alt: Contrapeso logo, nine-room hotel in Valparaíso, Chile
        pie: '**Contrapeso**. Nine-room hotel, Valparaíso, Chile'
        texto: 'The two words are the funicular cars on one cable: when one goes up, the other comes down.'
    - tipo: galeria
      columnas: 4
      titulo: Streetwear and urban culture
      imagenes:
      - imagen: /uploads/proyectos/logofolio/marca-05.jpg
        alt: BAM logo, clothing that only opens at night in Euljiro, Seoul
        pie: '**BAM**. Clothing that only opens at night, Euljiro, Seoul'
        texto: A Latin reader sees BAM; a Korean reader sees 밤, “night”, built as a single syllable block.
      - imagen: /uploads/proyectos/logofolio/marca-06.jpg
        alt: Lau logo, a sign painter's daughter's clothing in Sham Shui Po, Hong Kong
        pie: '**Lau**. A sign painter''s daughter''s clothing, Sham Shui Po, Hong Kong'
        texto: A single neon tube writes the whole name; the stretches that shouldn't glow are painted black.
      - imagen: /uploads/proyectos/logofolio/marca-07.jpg
        alt: Tope logo, skate brand in Barcelona, Spain
        pie: '**Tope**. Skate brand, Barcelona, Spain'
        texto: The letters are a curb with the skate stoppers the city bolts on. One has been ripped off.
      - imagen: /uploads/proyectos/logofolio/marca-08.jpg
        alt: Téci logo, neighborhood clothing in Saint-Denis, France
        pie: '**Téci**. Neighborhood clothing, Saint-Denis, France'
        texto: 'In verlan, syllables are flipped: CITÉ becomes TÉCI. The logo shows the cut.'
    - tipo: galeria
      columnas: 4
      titulo: Corporate and tech
      imagenes:
      - imagen: /uploads/proyectos/logofolio/marca-09.jpg
        alt: Cifuentes, Lara logo, contract litigation in Bogotá, Colombia
        pie: '**Cifuentes, Lara**. Contract litigation, Bogotá, Colombia'
        texto: The partners won their first case over a comma; the one between their surnames is the firm's signature.
      - imagen: /uploads/proyectos/logofolio/marca-10.jpg
        alt: Ocho logo, port logistics operator in Cartagena, Colombia
        pie: '**Ocho**. Port logistics operator, Cartagena, Colombia'
        texto: Every container rests on eight steel corner castings. In the logo, the Os are those corners.
      - imagen: /uploads/proyectos/logofolio/marca-11.jpg
        alt: Partida logo, bookkeeping for corner stores in Medellín, Colombia
        pie: '**Partida**. Bookkeeping for corner stores, Medellín, Colombia'
        texto: The T is a T-account, the diagram every accountant learns double-entry with.
      - imagen: /uploads/proyectos/logofolio/marca-12.jpg
        alt: Sal logo, cybersecurity in Montevideo, Uruguay
        pie: '**Sal**. Cybersecurity, Montevideo, Uruguay'
        texto: In cryptography, salt is the random data mixed into each password. The brand gets its pinch.
    - tipo: galeria
      columnas: 4
      titulo: Food and drink
      imagenes:
      - imagen: /uploads/proyectos/logofolio/marca-13.jpg
        alt: Arroba logo, single-farm coffee roaster in Manizales, Colombia
        pie: '**Arroba**. Single-farm coffee roaster, Manizales, Colombia'
        texto: 'Before email, @ stood for the arroba: 12.5 kg, the unit coffee is still paid in across Colombia.'
      - imagen: /uploads/proyectos/logofolio/marca-14.jpg
        alt: Repulgue logo, salteña empanadas in Salta, Argentina
        pie: '**Repulgue**. Salteña empanadas, Salta, Argentina'
        texto: In northern Argentina, the crimped edge tells you each empanada's filling. The word runs along that edge.
      - imagen: /uploads/proyectos/logofolio/marca-15.jpg
        alt: Sugi logo, single-brewery sake in Niigata, Japan
        pie: '**Sugi**. Single-brewery sake, Niigata, Japan'
        texto: 'Breweries hang a cedar ball: green when the new sake is out, brown once it has matured.'
      - imagen: /uploads/proyectos/logofolio/marca-16.jpg
        alt: Vaivén logo, cantina in Historic Center, Mexico City
        pie: '**Vaivén**. Cantina, Historic Center, Mexico City'
        texto: From above, swinging cantina doors draw a V; the second one is still moving because someone just walked in.
    - tipo: galeria
      columnas: 4
      titulo: Health, sport and mobility
      imagenes:
      - imagen: /uploads/proyectos/logofolio/marca-17.jpg
        alt: Oclusal logo, dental clinic in Quito, Ecuador
        pie: '**Oclusal**. Dental clinic, Quito, Ecuador'
        texto: 'No teeth, no smiles: the dental chart cell with its five surfaces, the occlusal one marked in the middle.'
      - imagen: /uploads/proyectos/logofolio/marca-18.jpg
        alt: Imperdible logo, running club in València, Spain
        pie: '**Imperdible**. Running club, València, Spain'
        texto: 'The race bib isn''t drawn: four crooked safety pins hold it up, the way everyone pins one on.'
      - imagen: /uploads/proyectos/logofolio/marca-19.jpg
        alt: Parpadeo logo, cats-only vet clinic in Montevideo, Uruguay
        pie: '**Parpadeo**. Cats-only vet clinic, Montevideo, Uruguay'
        texto: When a cat slowly closes its eyes at someone, it's saying it trusts them. The clinic signs with that gesture.
      - imagen: /uploads/proyectos/logofolio/marca-20.jpg
        alt: La Pata logo, motorcycle garage and meeting spot in Bogotá, Colombia
        pie: '**La Pata**. Motorcycle garage and meeting spot, Bogotá, Colombia'
        texto: From behind, a parked motorcycle is a slanted line resting on its kickstand. The l does the same.
    - tipo: texto
      titulo: Each brand, as a system
      texto: 'No brand stops at the logo: each one has positive, one-color, inverted and 16 px versions, a palette with CMYK values, typography and a real application.'
    - tipo: galeria
      columnas: 1
      imagenes:
      - imagen: /uploads/proyectos/logofolio/pagina-1.jpg
        alt: Logofolio page 1 with palette, typography and application for each brand
      - imagen: /uploads/proyectos/logofolio/pagina-2.jpg
        alt: Logofolio page 2 with palette, typography and application for each brand
      - imagen: /uploads/proyectos/logofolio/pagina-3.jpg
        alt: Logofolio page 3 with palette, typography and application for each brand
      - imagen: /uploads/proyectos/logofolio/pagina-4.jpg
        alt: Logofolio page 4 with palette, typography and application for each brand
      - imagen: /uploads/proyectos/logofolio/pagina-5.jpg
        alt: Logofolio page 5 with palette, typography and application for each brand
    creditos: |-
      Concept, naming and design: Alexander Caro.

      Every brand is fictional, created as an author concept. None of them is a real business.
