        > Puedes invertir en pauta, pero si el contenido no detiene el scroll, la plata se va. El diseño es lo que convierte la inversión en resultado.

        El trabajo con Orbidental y Biotec combinó diseño con criterio y pauta estratégica: piezas que se ganan la atención visualmente y una inversión que las pone frente a la gente correcta. Los resultados no son coincidencia.
