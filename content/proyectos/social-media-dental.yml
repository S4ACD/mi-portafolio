en:
  nombre: Dental Social Media
  alt: Orbidental social media post
  resumen: Content strategy and design for two dental supply brands at once, each with its own visual system.
  disciplinas:
  - Social media
  - Graphic design
  resultado:
    cifra: 179K
    texto: views in 4 months
  seo:
    titulo: Dental Social Media — Content That Sells | Alexander Caro
    descripcion: 'Social media design for the dental sector: carousels, posts and stories with a consistent visual system that turns views into conversations.'
  caso:
    portada: /uploads/proyectos/social-media-dental/portada-caso.jpg
    intro: Your competition already has better content than you. Every generic post you publish is an opportunity someone else is taking. This is what happens when design and strategy work together — and the numbers prove it.
    ficha:
    - etiqueta: Clients
      valor: Orbidental SAS · Biotec
    - etiqueta: My role
      valor: Art direction · Design · Visual strategy
    - etiqueta: Category
      valor: Dental supplies · Instagram
    - etiqueta: Deliverables
      valor: Posts, carousels, stories, special dates
    - etiqueta: Tools
      valor: Photoshop · Illustrator
    bloques:
    - tipo: cifras
      items:
      - cifra: 179K
        texto: Views in 4 months
      - cifra: +618%
        texto: Growth in views
      - cifra: 3.6K
        texto: Website clicks · +1,300%
      - cifra: +498%
        texto: Increase in interactions
      nota: '* Real data from Meta Business Suite · Orbidental · January–April 2026'
    - tipo: texto
      titulo: On social media, the best product doesn't win. The one that *stops the scroll first* does.
      texto: |-
        Most businesses post content because 'you have to post'. White background, product photo, price. No identity, no narrative, no reason for anyone to stop. The result: ad budget wasted on content nobody remembers.

        > You can invest in paid ads, but if the content doesn't stop the scroll, the money is gone. Design is what turns investment into results.

        The work with Orbidental and Biotec combined deliberate design with strategic paid ads: pieces that earn attention visually and investment that puts them in front of the right people. The results aren't a coincidence.
    - tipo: texto
      titulo: 4 months. Design + paid ads. *These results*.
      texto: Meta Business Suite doesn't lie. This is what the combination of intentional content design and well-targeted paid ads generated for Orbidental between January and April 2026.
    - tipo: imagen
      ancho: completo
      imagen: /assets/social/dental/estadisticas_4_meses_2026.webp
      alt: Orbidental Meta Business Suite insights, January to April 2026
    - tipo: texto
      titulo: Content that stops the scroll.
      texto: 'Every piece starts with a question: why would someone stop scrolling here? The answer defines the composition, typography, and color — not the other way around.'
    - tipo: galeria
      columnas: 4
      imagenes:
      - imagen: /assets/social/dental/orbidental-post-01.webp
        alt: Post Orbidental 01
      - imagen: /assets/social/dental/orbidental-post-02.webp
        alt: Post Orbidental 02
      - imagen: /assets/social/dental/orbidental-post-03.webp
        alt: Post Orbidental 03
      - imagen: /assets/social/dental/orbidental-post-04.webp
        alt: Post Orbidental 04
    - tipo: texto
      titulo: A story told across multiple slides.
      texto: Carousels retain attention longer and generate more interactions. Each slide has to work on its own and also as part of the whole.
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: /assets/social/dental/orbidental-carrusel-01-slide-01.webp
        alt: Carrusel Orbidental slide 1
      - imagen: /assets/social/dental/orbidental-carrusel-01-slide-02.webp
        alt: Carrusel Orbidental slide 2
      - imagen: /assets/social/dental/orbidental-carrusel-01-slide-03.webp
        alt: Carrusel Orbidental slide 3
    - tipo: texto
      titulo: The most-watched format. The most *ignored* in design.
      texto: Stories last 24 hours. The impression they leave, longer. A well-designed story communicates brand quality before the client reads a single word.
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: /assets/social/dental/orbidental-story-01.webp
        alt: Story Orbidental 01
      - imagen: /assets/social/dental/orbidental-story-02.webp
        alt: Story Orbidental 02
      - imagen: /assets/social/dental/orbidental-story-03.webp
        alt: Story Orbidental 03
    - tipo: texto
      titulo: Two brands, one niche, *zero confusion*.
      texto: Orbidental and Biotec share an industry. Their visual identities, they don't. This proves that design judgment doesn't depend on the brand — it depends on who applies it.
    - tipo: galeria
      columnas: 4
      imagenes:
      - imagen: /assets/social/dental/biotec-post-01.webp
        alt: Post Biotec 01
      - imagen: /assets/social/dental/biotec-post-02.webp
        alt: Post Biotec 02
      - imagen: /assets/social/dental/biotec-carrusel-01-slide-01.webp
        alt: Carrusel Biotec slide 1
      - imagen: /assets/social/dental/biotec-carrusel-01-slide-02.webp
        alt: Carrusel Biotec slide 2
      - imagen: /assets/social/dental/biotec-carrusel-01-slide-03.webp
        alt: Carrusel Biotec slide 3
      - imagen: /assets/social/dental/biotec-carrusel-01-slide-04.webp
        alt: Carrusel Biotec slide 4
      - imagen: /assets/social/dental/biotec-carrusel-01-slide-05.webp
        alt: Carrusel Biotec slide 5
      - imagen: /assets/social/dental/biotec-carrusel-01-slide-06.webp
        alt: Carrusel Biotec slide 6
    - tipo: texto
      titulo: The identity doesn't disappear on Halloween. *It adapts*.
      texto: A brand with visual judgment keeps its character on any date. The challenge isn't making something 'themed' — it's making something that's recognizably yours even when it has pumpkins.
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: /assets/social/dental/fecha-halloween-01.webp
        alt: Halloween 01
      - imagen: /assets/social/dental/fecha-halloween-02.webp
        alt: Halloween 02
      - imagen: /assets/social/dental/fecha-halloween-03.webp
        alt: Halloween 03
      - imagen: /assets/social/dental/fecha-amor-y-amistad-01.webp
        alt: Amor y Amistad 01
      - imagen: /assets/social/dental/fecha-amor-y-amistad-02.webp
        alt: Amor y Amistad 02
      - imagen: /assets/social/dental/fecha-amor-y-amistad-03.webp
        alt: Amor y Amistad 03
    cta:
      titulo: How many clients is your brand losing every week?
      texto: If your answer is 'I don't know', that's already too many. Generic content doesn't sell — and the budget you put into ads with mediocre design is money down the drain. Tell me what you sell and within 24 hours I'll show you how your brand should look on social media.
