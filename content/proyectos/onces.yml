      texto: |-
        Cada empaque tiene forma, mecanismo y un momento de revelación. Las crepes dulces van en cono, y el cono se encaja en el vaso de chocolate para comer caminando sin mancharse. Las saladas van en una caja que se abre como una mesa servida.

