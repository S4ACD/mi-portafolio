en:
  nombre: ONCES
  alt: Cover of the ONCES brand manual with the logo and a crepe cone next to a hot chocolate cup
  resumen: 'Identity and packaging for a crêperie in Chapinero, built on a ritual Bogotá already has: las onces, the afternoon snack.'
  disciplinas:
  - Branding
  - Packaging
  - Naming
  resultado:
    cifra: '8'
    texto: packaging pieces
  seo:
    titulo: ONCES — Identity and Packaging for a Bogotá Crêperie | Alexander Caro
    descripcion: 'Concept branding project: a Bogotá crêperie built on the local ritual of las onces. Naming, logo, visual system, voice and 8 packaging pieces that can be produced in Colombia.'
  caso:
    intro: 'A crêperie for Chapinero that nobody could mistake for another. The answer didn''t come from France but from grandma''s table: las onces, Bogotá''s afternoon snack.'
    ficha:
    - etiqueta: Role
      valor: Strategy, naming, identity and packaging
    - etiqueta: Deliverables
      valor: 32-page manual, logo and versions, graphic system, voice and 8 packaging pieces
    - etiqueta: Location
      valor: Chapinero, Bogotá
    bloques:
    - tipo: texto
      titulo: The brief
      texto: |-
        Create a sweet-and-savory crêperie for Chapinero from scratch, with packaging people want to photograph, share and remember.

        French clichés were off the table (Eiffel Tower, berets, “Parisian” scripts), and so was the generic café look: kraft with a black stamp, chalkboards, stock boxes with a logo slapped on.

        Before designing I asked twelve questions about audience, price, tone and operations. Weekend families come first, the kitchen makes 300+ crêpes a day, and the ask was clear: opening the package should feel like getting a gift.
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/onces/tres-caminos.jpg
      alt: 'Three brand routes explored: ONCES, RUANA and TAPIA'
      pie: Three routes explored, each with its own name, recipe and hero package. ONCES was chosen.
    - tipo: texto
      titulo: The idea
      texto: |-
        Las onces means Santafé hot chocolate, cheese melting into the cup and a carefully set table. Every Bogotá local owns the word, and no crêperie had claimed it.

        The idea takes the crêpe out of France and into a centuries-old local tradition, and it makes the house chocolate the star. And once means 11: the number hides in the icon, the 11-stamp loyalty card and the 11th of every month.
    - tipo: cita
      texto: If you didn't dip it in the chocolate, it wasn't onces.
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/onces/logo.jpg
      alt: 'ONCES logo: the o is an enamel tin cup seen from above'
      pie: The o is an enamel tin cup seen from above, chipped at two o’clock. The lettering follows 1970s hand-painted shop signs.
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: /uploads/proyectos/onces/versiones.jpg
        alt: ONCES logo versions
        pie: Five versions, from the storefront to an 8 mm sticker.
      - imagen: /uploads/proyectos/onces/construccion.jpg
        alt: ONCES logo construction and color
        pie: Construction, clear space and positive and negative versions.
    - tipo: colores
      titulo: Palette and proportion of use
      colores:
      - nombre: Cream
        hex: '#F3E3C3'
        proporcion: 45
      - nombre: Paper white
        hex: '#FFFDF8'
        proporcion: 25
      - nombre: Enamel red
        hex: '#B5452B'
        proporcion: 18
      - nombre: Chocolate
        hex: '#3B1F14'
        proporcion: 10
      - nombre: Mustard
        hex: '#E0A526'
        proporcion: 2
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: /uploads/proyectos/onces/tipografia.jpg
        alt: ONCES typefaces
        pie: Fraunces for headlines, DM Sans for text, and custom lettering for the logo only.
      - imagen: /uploads/proyectos/onces/recursos.jpg
        alt: ONCES graphic assets
        pie: 'Crochet, the enamel-red rim, the chip, sign-painter shadow and the hidden 11: five assets that identify the brand without the logo.'
    - tipo: texto
      titulo: The packaging
      texto: |-
        Every package has a shape, a mechanism and a reveal. Sweet crêpes come in a cone that slots into the chocolate cup, so you can eat while walking without a mess. Savory ones come in a box that opens like a set table.

        There are eight pieces, all producible in Colombia in board and paper, with a phased production plan that doesn't strain first-year cash flow.
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: /uploads/proyectos/onces/cono-y-pocillo.jpg
        alt: Crêpe cone slotted into the ONCES chocolate cup
        pie: The Cone, slotted into the cup.
      - imagen: /uploads/proyectos/onces/la-mesita.jpg
        alt: La Mesita package with a savory crêpe
        pie: La Mesita, for savory crêpes.
      - imagen: /uploads/proyectos/onces/mesa-de-onces.jpg
        alt: Mesa de Onces box open with four portions
        pie: 'Mesa de Onces: the box opens like a set table.'
      - imagen: /uploads/proyectos/onces/bolsa-hay-onces.jpg
        alt: Hay Onces delivery bag
        pie: Hay Onces, the delivery bag.
      - imagen: /uploads/proyectos/onces/pocillitos.jpg
        alt: Sauce cups and paper wraps
        pie: Sauce cups and paper wraps.
      - imagen: /uploads/proyectos/onces/edicion-aguacero.jpg
        alt: Rainy-season edition bag
        pie: Aguacero Edition, for the rainy season.
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/onces/voz.jpg
      alt: The ONCES voice applied to packaging and social
      pie: 'The voice: craftsman facts and Bogotá humor, never postcard clichés.'
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: /uploads/proyectos/onces/produccion.jpg
        alt: ONCES packaging production plan
        pie: Phased production plan.
      - imagen: /uploads/proyectos/onces/experiencia.jpg
        alt: The ONCES in-store experience
        pie: 'The ritual in the shop: the 4:11 p.m. chocolate hour, the wall of cups and the cone window.'
    creditos: |-
      Strategy, naming, identity, voice, packaging and manual: Alexander Caro.

      Concept project: ONCES is not a real business and there was no client. Base mockup photography was generated with AI; the logo, graphics and brand system are my own design.
