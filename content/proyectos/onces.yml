    - tipo: texto
      titulo: El encargo
      texto: |-
        Crear desde cero una crepería de dulce y sal para Chapinero, con empaques que la gente fotografíe, comparta y recuerde.

        Quedaron prohibidos los clichés franceses (Torre Eiffel, boinas, tipografías «parisinas») y la estética genérica de cafetería: kraft con sello negro, pizarras, cajas estándar con un logo pegado.

        Antes de diseñar hice doce preguntas sobre público, precio, tono y operación. Mandan las familias de fin de semana, salen más de 300 crepes al día y el pedido fue claro: que abrir el empaque se sienta como recibir un regalo.
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/onces/tres-caminos.jpg
      alt: 'Tres rutas de marca exploradas: ONCES, RUANA y TAPIA'
      pie: Tres rutas exploradas, cada una con nombre, receta y empaque estrella. Se eligió ONCES.
    - tipo: texto
      titulo: La idea
      texto: |-
        Las onces son chocolate santafereño, queso que se hunde en la taza y la mesa servida con cuidado. Cualquier rolo reconoce la palabra como suya y ninguna crepería la había reclamado.

        La idea saca la crepe de Francia y la pone en una tradición con siglos de historia, y convierte el chocolate de la casa en protagonista. Además, once es 11: el número se esconde en el isotipo, en la tarjeta de 11 sellos y en el día 11 de cada mes.
    - tipo: cita
      texto: Si no la untó en el chocolate, no han sido onces.
