    - tipo: texto
      titulo: Un sitio lento no es un problema técnico. Es un problema *de ventas*.
      texto: |-
        El sitio anterior estaba hecho en Divi: arrastraba más de un megabyte de código que nadie usaba en cada visita, no estaba pensado para móvil y, siendo honestos, se veía mal —fondo plano, fotos sueltas, texto sin jerarquía—. Tardaba 14 segundos en abrir.

        > Cada segundo de espera y cada pantalla rota en un celular era un cliente que cerraba la pestaña.

        Eso pasaba en un catálogo de +3.000 productos donde la gente llega buscando algo puntual y con prisa. Para una empresa que vende online, eso no se ve en el diseño: se ve en las ventas que no entran.

        Divi no se podía "optimizar": el peso estaba en el propio sistema. Había que sacarlo. Reconstruí todo en código limpio sobre WordPress, migré los más de 3.000 productos sin perder el SEO ya posicionado —un error ahí y se caen meses de ranking— y rehíce la experiencia visual para que el sitio por fin transmitiera la seriedad de la empresa.
    - tipo: lista
      titulo: No fue solo acelerar la web. Fue recuperar la confianza.
      texto: 'Orbidental tenía un problema técnico visible en cada visita: una web lenta, antigua y completamente rota en móvil. La solución fue reconstruirla con cuidado, sin perder el trabajo SEO ni el catálogo que ya existía.'
      items:
      - titulo: Una web que hacía desconfiar
        texto: El sitio tardaba en cargar, se veía como una web de 2013 y no era responsive. En móvil se rompían elementos y el constructor Divi limitaba el control visual. Un visitante podía irse antes de ver un producto o interpretar esa experiencia como una señal de poca seriedad.
      - titulo: Reconstrucción desde la raíz
        texto: Eliminé Divi y pasé toda la experiencia a código con HTML, CSS y JavaScript sobre WordPress. Durante mes y medio revisé qué conservar, migré el catálogo y cuidé cada URL, contenido y señal técnica para modernizar el sitio sin poner en riesgo el posicionamiento.
      - titulo: Más rápido, más claro y con más tráfico
        texto: La web pasó de PageSpeed 40 a 97, mantuvo y mejoró su SEO, y el tráfico aumentó. También recuperó una presentación visual moderna y una experiencia responsive. El e-commerce completo sigue en construcción, sobre una base mucho más sólida.
    - tipo: cita
      texto: 'La reacción de mi jefe fue clara: la página se ve mucho mejor visualmente y sí se nota que es rápida.'
      autor: Reacción del cliente, Orbidental
    - tipo: texto
      titulo: De "Desaprobado" a "Aprobado" en un mes.
      texto: 'No es mi opinión: es el propio reporte de Core Web Vitals (Métricas Web Esenciales) de Google. En un mes, el sitio pasó de "Desaprobado" a "Aprobado", y el PageSpeed subió de 40 a 97. En la práctica: 14 segundos de carga convertidos en una apertura casi instantánea.'
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1782220110/Antes_j9uony.png
        alt: 'Core Web Vitals de Orbidental antes del rediseño: evaluación desaprobada'
        pie: Antes
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1782220149/Despu%C3%A9s_iulu8r.png
        alt: 'Core Web Vitals de Orbidental después del rediseño: evaluación aprobada, PageSpeed 97'
        pie: Después
    - tipo: texto
      titulo: Meses de falla. Un mes de trabajo. *Aprobado y sosteniéndose*
      texto: 'El sitio llevaba meses con Core Web Vitals reprobado — Google lo marcaba como lento, lo que afecta directamente el posicionamiento y la experiencia del cliente. En un mes lo llevé de Desaprobado a Aprobado. Y lo más importante: el historial de Google muestra que la mejora se mantiene. No fue un parche temporal — fue una reconstrucción real.'
    - tipo: imagen
      ancho: completo
      imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1782220149/Core_web_vitals_sumart_vttkmm.png
      alt: 'Historial de Core Web Vitals de Orbidental: mejora continua durante más de un año'
      pie: 'Historial de Core Web Vitals — mejora sostenida durante más de un año. Fuente: Google Search Console.'
    - tipo: cifras
      items:
      - cifra: '90'
