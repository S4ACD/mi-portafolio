    bloques:
    - tipo: texto
      titulo: El motociclismo se vive con intensidad. *Su contenido casi nunca*.
      texto: |-
        El mundo de las motos está lleno de pasión: pilotos que entrenan a diario, equipos que compiten cada fin de semana, eventos que mueven comunidades enteras. Pero cuando llega el momento de comunicar —un anuncio de carrera, la presentación de un piloto, un evento— la mayoría termina con una plantilla genérica que no transmite nada de esa adrenalina.

        > Una marca deportiva que se ve floja comunica que el equipo es flojo. En un sector donde la imagen es identidad, una pieza sin fuerza es una oportunidad perdida.

        AcelerArte nace de ahí: de ser parte de esa cultura y entender que un flyer de motociclismo no es "un diseño bonito", es una declaración de actitud. Velocidad, riesgo, precisión — eso es lo que cada pieza tiene que hacer sentir antes de que alguien lea una sola palabra.
    - tipo: texto
      titulo: No diseño un flyer. Diseño *cómo se siente ir a 200*.
      texto: |-
        Cada pieza arranca con una pregunta: ¿qué tiene que sentir alguien al verla en su feed entre cientos de posts? La respuesta —tensión, potencia, movimiento— define todo: la composición tiene que tener velocidad aunque la imagen esté quieta, la tipografía tiene que verse afilada y agresiva, y el color tiene que cargar energía sin caer en el cliché de "rojo y negro genérico".

        Por eso integro la fotografía del piloto con luz dramática, líneas de movimiento, y un sistema tipográfico que se siente sacado del paddock de MotoGP. No es decoración: es traducir la identidad de cada piloto o equipo a una imagen que ellos quieren tener en su perfil — y que su comunidad quiere compartir.
    - tipo: texto
      titulo: El trabajo, pieza por pieza
      texto: 'Flyers deportivos para pilotos y equipos de motociclismo. Cada uno con su propia identidad de color y actitud, pero con la misma firma visual: alto impacto, estética de competición, listo para redes.'
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-1_oyll2h.webp
        alt: Flyer deportivo de motociclismo — piloto, estilo MotoGP en rojo
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-2_wxhlh0.webp
        alt: Flyer de carrera de motos — diseño deportivo azul
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-3_a3kxrr.webp
        alt: Diseño para piloto de motociclismo — Mario González, verde
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-4_ufa3zy.webp
        alt: Flyer deportivo de moto — Camilo Cadavid, cyan
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-5_ihtogs.webp
        alt: Diseño para piloto de motociclismo — Angelo Bonilla, Honda
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-6_qdtkda.webp
        alt: Flyer de competición de motos — Alexander Rodríguez
    - tipo: cifras
      titulo: El trabajo movió a la comunidad correcta
      items:
      - cifra: '+5.300'
        texto: Visitas al perfil en 28 días
        detalle: Alcance reciente de la cuenta de AcelerArte, impulsado por las piezas — no por pauta paga.
      - cifra: '161'
