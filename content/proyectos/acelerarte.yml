        detalle: Likes, comentarios y mensajes de una comunidad real de motociclismo, no de seguidores comprados.
      - cifra: ↗
        texto: Repost de pilotos reconocidos
        detalle: Pilotos como Mario González y Angelo Bonilla repostearon sus piezas en historias y escribieron para felicitar el trabajo.
      nota: '* Datos de Instagram (últimos 28 días). Además, cuentas de marcas del sector como CF Moto y Honda han interactuado con las piezas (reacciones en redes). Cifras reales, verificables en el perfil.'
    cta:
      titulo: ¿Tu equipo o evento merece verse a la altura de la pista?
      texto: Si sos piloto, manejás un equipo u organizás un evento de motos y estás cansado de plantillas genéricas, hablemos. Diseño flyers y contenido que se ven como se siente correr. Respondo en menos de 24 horas.
en:
  nombre: AcelerArte
  alt: AcelerArte flyer for a motorcycle race
  resumen: My own motorsport flyer brand, with race-grade aesthetics that riders actually repost.
  disciplinas:
  - Graphic design
  - Motorsport
  - Own brand
  resultado:
    cifra: 5,300+
    texto: visits in 28 days
  seo:
    titulo: AcelerArte — Sports Design for Motorcycle Racing | Alexander Caro
    descripcion: 'AcelerArte: race flyers and visual content for Colombian motorcycle racing — my own sports-design project with a real audience.'
  caso:
    portada_ajuste: completa
    etiqueta: Own brand
    intro: 'Sports flyers and visual content for the world of motorcycle racing: riders, teams, and events. My own brand — born from understanding racing culture from the inside, and translating that adrenaline into pieces people actually want to share.'
    ficha:
    - etiqueta: Type
      valor: Own brand
    - etiqueta: Sector
      valor: Competitive motorsport
    - etiqueta: My role
      valor: Identity, art direction and design of every piece
    - etiqueta: For whom
      valor: Riders, teams, and motorcycle events
    - etiqueta: Tools
      valor: Photoshop, Illustrator
    bloques:
    - tipo: texto
      titulo: Motorcycle racing is lived with intensity. *Its content almost never is.*
      texto: |-
        The motorcycle world is full of passion: riders training daily, teams competing every weekend, events that move entire communities. But when it comes time to communicate — a race announcement, a rider introduction, an event — most end up with a generic template that conveys none of that adrenaline.

        > A sports brand that looks weak communicates that the team is weak. In a sector where image is identity, a piece without force is a missed opportunity.

        AcelerArte was born from that: from being part of the culture and understanding that a motorsport flyer isn't "a nice design" — it's a statement of attitude. Speed, risk, precision — that's what every piece needs to make someone feel before they read a single word.
    - tipo: texto
      titulo: I don't design a flyer. I design *what it feels like to hit 200*.
      texto: |-
        Every piece starts with one question: what does someone need to feel when they see it in their feed among hundreds of posts? The answer — tension, power, motion — drives everything: the composition has to have speed even when the image is still, the typography has to look sharp and aggressive, and the color has to carry energy without falling into the cliché of "generic red and black".

        That's why I integrate rider photography with dramatic lighting, motion lines, and a typographic system that feels pulled from the MotoGP paddock. It's not decoration — it's translating each rider's or team's identity into an image they want on their profile, and that their community wants to share.
    - tipo: texto
      titulo: The work, piece by piece
      texto: 'Sports flyers for motorcycle riders and teams. Each one with its own color identity and attitude, but with the same visual signature: high impact, competition aesthetics, built for social media.'
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-1_oyll2h.webp
        alt: Flyer deportivo de motociclismo — piloto, estilo MotoGP en rojo
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-2_wxhlh0.webp
        alt: Flyer de carrera de motos — diseño deportivo azul
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-3_a3kxrr.webp
        alt: Diseño para piloto de motociclismo — Mario González, verde
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-4_ufa3zy.webp
        alt: Flyer deportivo de moto — Camilo Cadavid, cyan
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-5_ihtogs.webp
        alt: Diseño para piloto de motociclismo — Angelo Bonilla, Honda
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781873289/FLYER-6_qdtkda.webp
        alt: Flyer de competición de motos — Alexander Rodríguez
    - tipo: cifras
      titulo: The work moved the right community
      items:
      - cifra: '+5.300'
        texto: Profile visits in 28 days
        detalle: Recent reach for the AcelerArte account, driven by the pieces — not paid ads.
      - cifra: '161'
        texto: Interactions in the period
        detalle: Likes, comments, and messages from a real motorcycle community — not bought followers.
      - cifra: ↗
        texto: Reposts from recognized riders
        detalle: Riders like Mario González and Angelo Bonilla reposted their pieces in stories and messaged to congratulate the work.
      nota: '* Instagram data (last 28 days). Additionally, brand accounts in the sector such as CF Moto and Honda have interacted with the pieces. Real numbers, verifiable on the profile.'
    cta:
      titulo: Does your team or event deserve to look as good as the track?
      texto: If you're a rider, manage a team, or organize a motorcycle event and you're tired of generic templates — let's talk. I design flyers and content that look like racing feels. I reply within 24 hours.
