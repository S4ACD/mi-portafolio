en:
  nombre: Double Notch
  alt: Double Notch logo over a Garment District street in New York at night
  resumen: A streetwear label born from the vocabulary of New York's Garment District cutters, with a first drop of 8 pieces.
  disciplinas:
  - Branding
  - Product
  - Art direction
  resultado:
    cifra: '8'
    texto: pieces in Drop 001
  seo:
    titulo: Double Notch — Streetwear Identity and Drop 001 | Alexander Caro
    descripcion: 'Concept project: a New York streetwear label built from the language of the Garment District''s cutters. Drawn logotype, identity system and an 8-piece drop.'
  caso:
    intro: A New York label that could drop tomorrow, without the skyline, the taxi or a varsity “NYC”. The answer was on West 38th Street, in the private vocabulary of the people who still cut and sew in the Garment District.
    ficha:
    - etiqueta: Role
      valor: Strategy, naming, logotype, identity system, product design and art direction
    - etiqueta: Deliverables
      valor: 'Full identity and Drop 001: hoodie, tee, cap, bandana, trims, bag and a 7" record'
    - etiqueta: Location
      valor: Garment District, New York
    bloques:
    - tipo: texto
      titulo: The insight
      texto: |-
        Every pattern piece carries small triangular cuts so sewers know how pieces meet. A single notch marks the front; a double notch marks the back.

        Double Notch is the brand for the people who have your back: the cutters, the pushers, the night shift.
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/double-notch/logo.jpg
      alt: Double Notch stacked logotype
      pie: 'A drawn logotype: two 6 × 6 cuts in the top bar of the O.'
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: /uploads/proyectos/double-notch/construccion.jpg
        alt: Double Notch logotype construction grid
        pie: A 14-unit module, quarter-circle corners and every edge on the grid.
      - imagen: /uploads/proyectos/double-notch/versiones.jpg
        alt: Double Notch logotype versions
        pie: Positive, negative, one color and clear space.
    - tipo: colores
      titulo: Palette and proportion of use
      colores:
      - nombre: Deep olive
        hex: '#2F3322'
        proporcion: 50
      - nombre: Bone
        hex: '#E8DFC8'
        proporcion: 30
      - nombre: Leather
        hex: '#7A4E2D'
        proporcion: 10
      - nombre: Chalk mustard
        hex: '#C79A3B'
        proporcion: 5
      - nombre: Charcoal
        hex: '#171712'
        proporcion: 5
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: /uploads/proyectos/double-notch/tipografia.jpg
        alt: Double Notch typography
        pie: Lora carries the voice, like the sleeve notes on a 1960s jazz record; Inter carries sizes, lots and prices.
      - imagen: /uploads/proyectos/double-notch/patron.jpg
        alt: Double Notch cutting-marker pattern
        pie: The pattern is a cutting marker, drawn as a repeat.
    - tipo: texto
      titulo: Drop 001
      texto: |-
        Eight pieces where the graphic shows up when you walk away. The hoodie carries its own pattern printed on the back; the tee, its full cutting marker. "Buy a T-shirt, wear the plan of the T-shirt."

        The collectible is a one-sided 7" lathe-cut record, side B only, numbered 001 to 250: the brand idea turned into an object.
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: /uploads/proyectos/double-notch/hoodie.jpg
        alt: Olive Back Piece Hoodie on a cutting table
        pie: 'Back Piece Hoodie: quiet in front.'
      - imagen: /uploads/proyectos/double-notch/camiseta.jpg
        alt: Marker Tee seen from the back in a workshop
        pie: 'Marker Tee: wear the plan.'
      - imagen: /uploads/proyectos/double-notch/gorra.jpg
        alt: Leather-brown Cutter’s Six-Panel
        pie: Cutter’s Six-Panel with the embroidered icon.
      - imagen: /uploads/proyectos/double-notch/etiqueta.jpg
        alt: Hangtag with a signed lot ticket
        pie: Every piece leaves as a signed lot.
      - imagen: /uploads/proyectos/double-notch/bolsa.jpg
        alt: Back Room bag with the die-cut double notch
        pie: The notch is cut, not printed.
      - imagen: /uploads/proyectos/double-notch/vinilo.jpg
        alt: Back Piece Sessions 7-inch record
        pie: A record with no side A.
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/double-notch/calle.jpg
      alt: Person wearing the Double Notch hoodie walking down West 38th Street at night
      pie: The graphic shows up when you walk away.
    creditos: |-
      Strategy, naming, logotype, identity system, product design and art direction: Alexander Caro.

      Concept project: Double Notch is a fictional brand, not affiliated with any real company, person or organization. Base mockup photography was generated with AI; the logo, graphics and brand system are my own design.
