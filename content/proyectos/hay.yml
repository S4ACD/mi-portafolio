en:
  nombre: ¡HAY!
  alt: ¡HAY! logo as a fuchsia tin sign
  resumen: A campaign identity for a fictional Bogotá mayoral race, built from the language of corner-store signs.
  disciplinas:
  - Branding
  - Campaign
  - Merch
  resultado:
    cifra: '13'
    texto: merch pieces
  seo:
    titulo: ¡HAY! — A Campaign Identity Built From Corner-Store Signs | Alexander Caro
    descripcion: 'Concept project: a mayoral campaign identity for Bogotá that young people would actually wear. Tin-sign logo, modular sign system, tone of voice and 13 merch pieces.'
  caso:
    portada: /uploads/proyectos/hay/portada.jpg
    intro: 'In Colombia, nobody wears a politician''s T-shirt. The brief: a Bogotá mayoral campaign identity people would use, stick and share even if they don''t care about politics.'
    ficha:
    - etiqueta: Role
      valor: Concept, identity, tone of voice and merch
    - etiqueta: Deliverables
      valor: Brand manual, modular sign, graphic assets and 13 merch pieces
    - etiqueta: Audience
      valor: Bogotá residents aged 18 to 28
    bloques:
    - tipo: texto
      titulo: The concept
      texto: |-
        Election advertising is a wall of smiling faces, flags and promises nobody remembers. Young people aged 18 to 28, the group that votes least, have stopped looking.

        Corner-store signs ("Hay pan", "Hay gas", "No fío") are Bogotá's most honest language. HAY ("there is") turns them into a system: a corner store doesn't promise, it announces what there is.
    - tipo: imagen
      ancho: completo
      imagen: /uploads/proyectos/hay/logo.jpg
      alt: ¡HAY! logo as a hand-painted tin sign
      pie: A hand-lettered tin sign with a sign painter's drop shadow and two nails.
