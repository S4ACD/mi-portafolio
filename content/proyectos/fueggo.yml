    descripcion: 'Proyecto propio: construí de cero la identidad completa de Fueggo, una marca conceptual de comida a la brasa — logo, manual de marca, fachada, empaques y uniformes, todo listo para producción.'
  caso:
    intro: 'Proyecto conceptual de marca, creado de cero para demostrar un sistema de identidad completo: una comida rápida a la brasa que compite entre docenas de locales casi idénticos y necesita reconocerse antes de leer el nombre. Sin cliente de por medio — el brief, la estrategia y cada pieza son míos.'
