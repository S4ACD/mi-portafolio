    - etiqueta: Herramientas
      valor: Illustrator, Photoshop
    bloques:
    - tipo: texto
      titulo: Sin identidad, un restaurante nuevo no compite. *Se diluye*.
      texto: |-
        Fueggo no existe como negocio: es un escenario realista que me planteé como brief. El punto de partida: un producto claro —hamburguesas a la brasa, con carbón, con ese sabor que solo da el fuego directo— y ninguna cara visual. Ni logo, ni paleta, ni sistema.

        > En comida rápida a la brasa, el cliente decide en segundos entre opciones casi idénticas. Ese es el problema que este sistema resuelve: reconocerse a primera vista.

        El reto no era "hacer un logo bonito". Era traducir el concepto del producto —fuego, carbón, intensidad, velocidad— a un sistema visual que funcionara igual de bien en un uniforme, en una caja de empaque y en una fachada, y que cualquier proveedor de impresión pudiera aplicar sin perder consistencia.
    - tipo: imagen
      ancho: logo
      imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033539/LOGO-FUEGGO_gozt0l.png
      alt: Logo Fueggo
    - tipo: texto
      titulo: Cada trazo tenía que oler a carbón
      texto: |-
        No diseñé un logo y después "lo apliqué" a todo lo demás. Empecé al revés: ¿qué tiene que sentir alguien al ver una caja de Fueggo en la mano, o el uniforme de quien le entrega el pedido? La respuesta —fuego, carácter, velocidad— definió cada decisión: la tipografía tenía que verse afilada y rápida, la paleta tenía que evocar brasa y carbón sin caer en el rojo-amarillo genérico de "comida rápida", y el símbolo tenía que funcionar tan pequeño como un sticker y tan grande como una fachada.

        Esa disciplina es la diferencia entre un logo que se ve bien en una pantalla y un sistema de marca que sobrevive a la imprenta, al sol, al uso diario y a quien lo aplique sin supervisión.
    - tipo: texto
      titulo: Un logo es fácil. Un *sistema* que no se rompe, no.
      texto: |-
        Cualquiera puede entregar un logo en PNG. Lo que de verdad protege a una marca es que ese logo siga funcionando igual de bien en una fachada de varios metros, en un sticker de tres centímetros, sobre cartón texturizado o estampado en tela de uniforme — sin que nadie tenga que "arreglarlo" cada vez.

        Eso significó construir variantes del logo para distintos fondos y tamaños, definir una paleta con jerarquía clara (no solo "los colores de la marca", sino cuál va de fondo, cuál de acento, cuál solo para detalles), y dejarlo todo documentado en un manual de marca para que cualquier imprenta o proveedor futuro lo aplique sin pedirme permiso cada vez.
    - tipo: texto
      titulo: El sistema, pieza por pieza
      texto: 'Fueggo es una marca conceptual creada por mí de principio a fin — no existe el local ni el cliente. Lo que ves es el sistema completo tal como saldría a producción: cada pieza resuelta, documentada y lista para imprenta desde el día uno.'
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033140/Mock-Up-Caja_hiq9ii.png
        alt: Fueggo — Diseño de caja de empaque
        pie: Caja de empaque — diseño listo para impresión
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033136/Uniforme_o95iz6.png
        alt: Fueggo — Diseño de uniforme
        pie: Diseño de uniforme — listo para confección
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033133/Papel-texturizado_mftym1.png
        alt: Fueggo — Papelería
        pie: Papelería
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033133/Stikers_cobiic.png
        alt: Fueggo — Stickers
        pie: Stickers
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033133/StikersPNG_mfm9ne.png
        alt: Fueggo — Stickers, variantes
        pie: Stickers — variantes
    - tipo: cifras
      titulo: Lo que este proyecto demuestra.
      items:
      - cifra: '6'
        texto: Aplicaciones diseñadas
        detalle: Fachada, empaque, uniforme, papelería y dos sets de stickers — cada pieza resuelta y lista para producción, no solo un logo suelto.
      - cifra: '0'
        texto: Retrabajo al pasar a producción
        detalle: 'Todo documentado y listo para imprenta: variantes, medidas y usos definidos. Quien produzca estas piezas no tiene que improvisar ni rediseñar nada.'
      - cifra: 100%
        texto: Documentado en manual de marca
        detalle: Logo, variantes, paleta con jerarquía y usos definidos — cualquier imprenta o proveedor lo aplica sin perder consistencia y sin pedir permiso.
      nota: '* Proyecto conceptual sin cliente: no hay métricas de negocio que reportar. Lo medible aquí es el sistema — completo, documentado y listo para producción real.'
    cta:
      titulo: ¿Tu marca va a salir al mercado sin una cara propia?
      texto: 'Si tu producto ya está listo pero no tienes un sistema de marca que lo respalde, este es exactamente el problema para el que diseñé Fueggo. La diferencia: tu proyecto sí tendrá cliente, fechas y piezas impresas de verdad. Cuéntamelo — respondo en menos de 24 horas.'
en:
  nombre: Fueggo
  alt: Fueggo storefront with its visual identity
  resumen: A complete brand system for a flame-grill restaurant concept, from logo to storefront, packaging and uniforms.
  disciplinas:
  - Branding
  - Restaurant
  seo:
    titulo: Fueggo — Concept Identity System, From Zero to Production | Alexander Caro
    descripcion: 'Self-initiated project: I built Fueggo''s complete brand identity from scratch — logo, brand manual, storefront, packaging and uniforms, all production-ready.'
  caso:
    intro: 'A self-initiated concept brand, built from scratch to demonstrate a complete identity system: a fast grilled-food spot competing among dozens of nearly identical places, needing to be recognized before you read the name. No client involved — the brief, the strategy and every piece are mine.'
    ficha:
    - etiqueta: Client
      valor: Fueggo
    - etiqueta: Category
      valor: Fast grilled food
    - etiqueta: My role
      valor: Brand identity from zero to complete system
    - etiqueta: Deliverables
      valor: Logo, brand guidelines, storefront, packaging, uniforms, stationery, stickers
    - etiqueta: Tools
      valor: Illustrator, Photoshop
    bloques:
    - tipo: texto
      titulo: Without an identity, a new restaurant doesn't compete. *It disappears.*
      texto: |-
        Fueggo doesn't exist as a business: it's a realistic scenario I set myself as a brief. The starting point: a clear product — charcoal-grilled burgers, with that flavor only direct fire gives — and no visual face. No logo, no palette, no system.

        > In fast grilled food, customers decide in seconds between nearly identical options. That's the problem this system solves: instant recognition.

        The brief wasn't "make a nice logo". It was translating the product concept — fire, charcoal, intensity, speed — into a visual system that worked equally well on a uniform, a packaging box, and a storefront, and that any print vendor could apply without losing consistency.
    - tipo: imagen
      ancho: logo
      imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033539/LOGO-FUEGGO_gozt0l.png
      alt: Logo Fueggo
    - tipo: texto
      titulo: Every line had to smell like charcoal
      texto: |-
        I didn't design a logo and then "apply it" to everything else. I started backwards: what does someone need to feel when they see a Fueggo box in hand, or the uniform of the person delivering their order? The answer — fire, character, speed — drove every decision: the typeface had to look sharp and fast, the palette had to evoke grill and charcoal without falling into the generic red-yellow of "fast food", and the symbol had to work as small as a sticker and as large as a storefront.

        That discipline is the difference between a logo that looks good on screen and a brand system that survives the print shop, the sun, daily use, and whoever applies it without supervision.
    - tipo: texto
      titulo: A logo is easy. A *system* that doesn't break — that's different.
      texto: |-
        Anyone can deliver a logo as a PNG. What actually protects a brand is that logo working just as well on a multi-meter storefront as on a three-centimeter sticker, on textured cardboard or printed on uniform fabric — without anyone needing to "fix it" every time.

        That meant building logo variants for different backgrounds and sizes, defining a palette with clear hierarchy (not just "the brand colors", but which one is background, which is accent, which is detail-only), and documenting everything in brand guidelines so any future print shop or vendor can apply it without asking me every time.
    - tipo: texto
      titulo: The system, piece by piece
      texto: 'Fueggo is a concept brand I created end to end — there is no venue and no client. What you see is the complete system exactly as it would go to production: every piece resolved, documented and print-ready from day one.'
    - tipo: galeria
      columnas: 2
      imagenes:
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033140/Mock-Up-Caja_hiq9ii.png
        alt: Fueggo — Diseño de caja de empaque
        pie: Packaging box — print-ready design
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033136/Uniforme_o95iz6.png
        alt: Fueggo — Diseño de uniforme
        pie: Uniform design — ready for production
    - tipo: galeria
      columnas: 3
      imagenes:
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033133/Papel-texturizado_mftym1.png
        alt: Fueggo — Papelería
        pie: Papelería
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033133/Stikers_cobiic.png
        alt: Fueggo — Stickers
        pie: Stickers
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1781033133/StikersPNG_mfm9ne.png
        alt: Fueggo — Stickers, variantes
        pie: Stickers — variantes
    - tipo: cifras
      titulo: What this project demonstrates.
      items:
      - cifra: '6'
        texto: Applications designed
        detalle: Storefront, packaging, uniform, stationery, and two sticker sets — every piece resolved and production-ready, not just a standalone logo.
      - cifra: '0'
        texto: Rework when moving to production
        detalle: 'Everything documented and print-ready: variants, sizes and usage rules defined. Whoever produces these pieces never has to improvise or redesign anything.'
      - cifra: 100%
        texto: Documented in brand guidelines
        detalle: Logo, variants, palette with defined hierarchy and usage rules — any printer or vendor can apply it consistently without asking permission.
      nota: '* Self-initiated concept with no client — so no business metrics to report. What''s measurable here is the system itself: complete, documented and ready for real production.'
    cta:
      titulo: Is your brand going to market without a face of its own?
      texto: 'If your product is ready but you don''t have a brand system to back it up, this is exactly the problem I designed Fueggo for. The difference: your project will have a real client, real deadlines and real printed pieces. Tell me about it — I reply within 24 hours.'
