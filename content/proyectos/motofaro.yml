        texto: PageSpeed escritorio
      - cifra: '84'
        texto: PageSpeed móvil
      - cifra: '100'
        texto: SEO técnico
      - cifra: '12'
        texto: Productos comparables
      nota: '* Métricas de rendimiento medidas con Google PageSpeed Insights sobre el sitio en producción. La monetización por afiliados está en fase temprana — este caso documenta la construcción del producto y su base técnica, no ingresos.'
    - tipo: lista
      titulo: Rendimiento y SEO no se negocian entre sí.
      texto: Un comparador con imágenes de producto, filtros dinámicos y muchas páginas suele ser pesado y lento. El reto fue mantener PageSpeed alto Y el catálogo completo indexable al mismo tiempo. Estas son las decisiones que lo hicieron posible.
      items:
      - titulo: Una sola fuente de datos alimenta todo el sitio
        texto: Todo el catálogo vive en un solo archivo de datos estructurado. De ahí se generan las páginas de producto, las de categoría y el comparador — sin duplicar contenido y sin base de datos. Añadir un producto es editar un objeto, y el sitio entero se actualiza de forma consistente.
      - titulo: Imágenes optimizadas sin sacrificar velocidad
        texto: 'Uso el sistema de imágenes de Next.js para servir cada foto en el formato y tamaño exactos que necesita cada dispositivo. Resultado: catálogo visualmente rico con PageSpeed 99 en escritorio y 84 en móvil, sin bloquear el renderizado.'
      - titulo: SEO técnico 100/100 con metadatos y datos estructurados
        texto: 'Cada página tiene su meta description, Open Graph con locale es_CO, Twitter cards y marcado orientado a producto. La divulgación de afiliados es visible y cumple la normativa. Google no solo indexa el sitio: entiende qué es cada página y para quién.'
