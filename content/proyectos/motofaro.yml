en:
  nombre: MotoFaro
  alt: MotoFaro side-by-side comparison with specs, price and score
  resumen: A motorcycle gear comparison site in Next.js, with SEO as the architecture from the first commit.
  disciplinas:
  - Web
  - Next.js
  - Technical SEO
  resultado:
    cifra: '99'
    texto: PageSpeed, technical SEO 100/100
  seo:
    titulo: MotoFaro — Motorcycle Gear Comparison Engine with Technical SEO | Alexander Caro
    descripcion: 'Self-initiated project: I built MotoFaro from scratch — a motorcycle-gear comparison engine in Next.js with an SEO-first architecture, PageSpeed 99 and technical SEO 100/100.'
  caso:
    intro: 'A motorcycle-gear comparison engine built in Next.js with an SEO-first architecture: filterable catalog, side-by-side comparison and a quiz recommender — all driven from a single data source and optimized to capture purchase-intent traffic. Self-initiated project, from zero to production.'
    ficha:
    - etiqueta: Client
      valor: MotoFaro (own concept)
    - etiqueta: My role
      valor: Product + design + development + SEO
    - etiqueta: Stack
      valor: Next.js · React · Tailwind CSS
    - etiqueta: Focus
      valor: Technical SEO · purchase intent
    bloques:
    - tipo: texto
      titulo: In a comparison engine, SEO isn't a layer — it's the architecture.
      texto: |-
        Someone searching "best motorcycle intercom in Colombia" is one click from buying. The challenge wasn't to design something pretty: it was to build a site where every product, category and comparison is an indexable, fast page with structured data — so Google understands the catalog and surfaces it exactly when someone is deciding what to buy.

        > Affiliate monetization is the business goal; technical SEO is what makes it possible. This project is the proof that I can build that foundation.
    - tipo: texto
      titulo: A real product, live — not a mockup.
      texto: 'MotoFaro is deployed and running: 12 scored products, category filters, six sort modes, a side-by-side comparison and a quiz that recommends based on your riding profile. This is the real site embedded — click to open it full.'
    - tipo: sitio
      url: https://motofaro.vercel.app/
      pie: 'Live view of MotoFaro: browse it right here or open it in a new tab.'
    - tipo: cifras
      titulo: Measured, not promised.
      items:
      - cifra: '99'
        texto: PageSpeed desktop
      - cifra: '84'
        texto: PageSpeed mobile
      - cifra: '100'
        texto: Technical SEO
      - cifra: '12'
        texto: Comparable products
      nota: '* Performance metrics measured with Google PageSpeed Insights on the production site. Affiliate monetization is in an early stage — this case documents the product build and its technical foundation, not revenue.'
    - tipo: lista
      titulo: Performance and SEO don't trade against each other.
      texto: A comparison engine with product images, dynamic filters and many pages is usually heavy and slow. The challenge was keeping PageSpeed high AND the full catalog indexable at once. These are the decisions that made it possible.
      items:
      - titulo: A single data source feeds the whole site
        texto: The entire catalog lives in a single structured data file. Product pages, category pages and the comparison engine are all generated from it — no duplicate content, no database. Adding a product means editing one object, and the whole site updates consistently.
      - titulo: Optimized images without sacrificing speed
        texto: 'I use Next.js''s image system to serve every photo in the exact format and size each device needs. Result: a visually rich catalog with PageSpeed 99 on desktop and 84 on mobile, without blocking rendering.'
      - titulo: Technical SEO 100/100 with metadata and structured data
        texto: 'Every page has its own meta description, Open Graph with es_CO locale, Twitter cards and product-oriented markup. The affiliate disclosure is visible and compliant. Google doesn''t just index the site: it understands what each page is and who it''s for.'
    - tipo: galeria
      titulo: The comparison engine in action.
      columnas: 2
      imagenes:
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1783086186/Comparador-FOTO2_p1ssm7.webp
        alt: Ficha de producto de MotoFaro con puntuación y detalle técnico
        pie: Product page with score and technical detail, built for purchase intent.
      - imagen: https://res.cloudinary.com/dg2wnq6ao/image/upload/v1783086186/Metricas-motofaro_p3nm90.webp
        alt: 'Métricas de PageSpeed de MotoFaro: 99 escritorio, SEO 100'
        pie: 'Real PageSpeed: 99 desktop, SEO and Best Practices 100/100.'
    cta:
      titulo: Do you need a site Google understands and that loads fast?
      texto: If your business lives on showing up in search, that's exactly the kind of technical foundation I build. Tell me about your project — I reply within 24 hours.
